global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: otel-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: olist-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: olist-worker
    static_configs:
      - targets: ["worker:9101"]
