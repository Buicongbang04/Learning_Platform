name: mlops

services:
  postgres:
    image: postgres:16.9
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlflow
    ports:
      - "127.0.0.1:${MLOPS_PG_PORT:-25433}:5432"
    volumes:
      - mlops_pg:/var/lib/postgresql/data
    mem_limit: 512m
    cpuset: "${DEVOPS_CPUSET:-}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # minio/minio và minio/mc không còn trên Docker Hub; pgsty/* là bản build cộng đồng cùng mã nguồn.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${MLOPS_MINIO_PORT:-29000}:9000"
      - "127.0.0.1:${MLOPS_MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - mlops_minio:/data
    mem_limit: 512m
    cpuset: "${DEVOPS_CPUSET:-}"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: pgsty/mc:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/mlflow &&
        mc mb --ignore-existing local/dvc
    restart: "no"
    mem_limit: 128m
    cpuset: "${DEVOPS_CPUSET:-}"

  mlflow:
    build: ./mlflow
    image: mlops-mlflow:3.17.1
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://mlops:mlops@postgres:5432/mlflow
      - --artifacts-destination=s3://mlflow
      - --serve-artifacts
      - --workers=1
      # Cho phép gọi từ container khác (Host: mlflow:5000) và từ host qua cổng đã map.
      - --allowed-hosts=mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "127.0.0.1:${MLOPS_MLFLOW_PORT:-25000}:5000"
    mem_limit: 1536m
    cpuset: "${DEVOPS_CPUSET:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${MLOPS_PROMETHEUS_PORT:-29090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
    cpuset: "${DEVOPS_CPUSET:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:${MLOPS_ALERTMANAGER_PORT:-29093}:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    mem_limit: 128m
    cpuset: "${DEVOPS_CPUSET:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${MLOPS_GRAFANA_PORT:-23000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 384m
    cpuset: "${DEVOPS_CPUSET:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.5
    profiles: ["feast"]
    ports:
      - "127.0.0.1:${MLOPS_REDIS_PORT:-26390}:6379"
    mem_limit: 128m
    cpuset: "${DEVOPS_CPUSET:-}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # KRaft 1 node (broker + controller), không ZooKeeper. Listener PLAINTEXT cho container trong mạng mlops_default
    # (kafka:9092), listener HOST cho máy (127.0.0.1:MLOPS_KAFKA_PORT). Không volume: topic mất khi xoá container.
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    profiles: ["streaming"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:${MLOPS_KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${MLOPS_KAFKA_PORT:-29092}:9094"
    mem_limit: 1g
    cpuset: "${DEVOPS_CPUSET:-}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 15s

volumes:
  mlops_pg:
  mlops_minio:
