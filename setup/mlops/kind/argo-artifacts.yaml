apiVersion: v1
kind: Secret
metadata:
  name: argo-artifacts
  namespace: argo
stringData:
  accesskey: mlops-argo
  secretkey: mlops-argo-local-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-artifacts
  namespace: argo
  labels:
    app: argo-artifacts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argo-artifacts
  template:
    metadata:
      labels:
        app: argo-artifacts
    spec:
      containers:
        - name: minio
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
          args: ["server", "/data"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: argo-artifacts
                  key: accesskey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: argo-artifacts
                  key: secretkey
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: argo-artifacts
  namespace: argo
spec:
  selector:
    app: argo-artifacts
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
  namespace: argo
data:
  artifactRepository: |
    archiveLogs: false
    s3:
      bucket: argo-artifacts
      endpoint: argo-artifacts.argo.svc.cluster.local:9000
      insecure: true
      useSDKCreds: true
      createBucketIfNotPresent:
        objectLocking: false
  executor: |
    env:
      - name: AWS_ACCESS_KEY_ID
        value: mlops-argo
      - name: AWS_SECRET_ACCESS_KEY
        value: mlops-argo-local-only
      - name: AWS_REGION
        value: us-east-1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mlops-argo-executor
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
