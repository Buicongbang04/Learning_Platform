# Dịch vụ dùng chung cho lộ trình Data Engineer.
#
# Bật một dịch vụ (profile của nó tự bật khi gọi tên service):
#   docker compose -f setup/docker-compose.yml up -d postgres
# Bật theo nhóm:
#   docker compose -f setup/docker-compose.yml --profile nosql up -d
# Nhóm: sql (postgres), nosql (mongo, redis, cassandra, neo4j), lake (minio),
#       stream (kafka), bi (metabase + superset + postgres), cloud (localstack), all (tất cả)
# Tắt (giữ dữ liệu):     docker compose -f setup/docker-compose.yml --profile all down
# Tắt và xoá dữ liệu:    docker compose -f setup/docker-compose.yml --profile all down -v
#
# Thông số kết nối khớp testkit.py và CONTENT_SPEC.md.

name: de-learning

services:
  postgres:
    image: postgres:16.9
    profiles: [sql, bi, all]
    environment:
      POSTGRES_USER: de
      POSTGRES_PASSWORD: de
      POSTGRES_DB: de
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de -d de"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7.0.21
    profiles: [nosql, all]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.5
    profiles: [nosql, all]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  cassandra:
    image: cassandra:5.0.4
    profiles: [nosql, all]
    environment:
      # Giới hạn heap cho máy local (mặc định Cassandra lấy 1/4 RAM).
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_CLUSTER_NAME: de-learning
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  neo4j:
    image: neo4j:5.26.10
    profiles: [nosql, all]
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  minio:
    # Image chính thức minio/minio không còn phát hành trên Docker Hub; pgsty/minio là bản build cộng đồng cùng mã nguồn.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    profiles: [lake, all]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # Apache Kafka chính chủ, chế độ KRaft một node (không cần ZooKeeper).
    image: apache/kafka:3.9.1
    profiles: [stream, all]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT: cho container khác trong network (kafka:9092)
      # EXTERNAL:  cho máy host (localhost:9094)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  metabase:
    image: metabase/metabase:v0.55.9
    profiles: [bi, all]
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_OPTS: "-Xmx1g"
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  superset:
    # Apache Superset 6.1.0 + driver psycopg2 (xem bi/Dockerfile.superset). Metadata lưu SQLite trong volume.
    # Đăng nhập admin / admin. Lần đầu mất ~1-2 phút để db upgrade + init.
    build:
      context: ./bi
      dockerfile: Dockerfile.superset
    image: de-learning-superset:6.1.0
    profiles: [bi, all]
    environment:
      FLASK_APP: "superset.app:create_app()"
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-de-learning-local-only-secret-key-change-me-0123456789}
      SUPERSET_LOAD_EXAMPLES: "no"
    command:
      - sh
      - -c
      - |
        set -e
        superset db upgrade
        # Chỉ bỏ qua lỗi "admin đã tồn tại"; lỗi khác dừng container.
        if ! out=$$(superset fab create-admin --username admin --password admin --firstname Admin --lastname User --email admin@example.com 2>&1); then
          echo "$$out" | grep -q -i "already exist\|exist" || { echo "$$out"; exit 1; }
        fi
        superset init
        exec /usr/bin/run-server.sh
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    volumes:
      - superset_data:/app/superset_home
      - ./bi/superset_config.py:/app/superset_config.py:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

  localstack:
    # Giả lập API AWS (S3, IAM, STS...) trên máy local cho module 11-cloud, không tốn tiền.
    # Pin bản 4.x community: các bản mới hơn có thể yêu cầu LOCALSTACK_AUTH_TOKEN.
    image: localstack/localstack:4.4.0
    profiles: [cloud, all]
    environment:
      SERVICES: s3,iam,sts
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

# Mọi service chung network `de-net`: từ Metabase kết nối Postgres bằng host `postgres`,
# từ container khác kết nối Kafka bằng `kafka:9092`.
networks:
  default:
    name: de-net

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  cassandra_data:
  neo4j_data:
  minio_data:
  kafka_data:
  metabase_data:
  superset_data:
  localstack_data:
