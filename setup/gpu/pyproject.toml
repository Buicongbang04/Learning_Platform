[project]
name = "ai-gpu"
version = "0.1.0"
description = "Môi trường CUDA riêng cho bài train nặng (fine-tune, QLoRA) của track AI Engineer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers>=5.22",
    "accelerate>=1.15",
    "peft>=0.21",
    "trl>=1.17",
    "bitsandbytes>=0.50",
    "datasets>=5.1",
    # giai đoạn 3: thư viện module GPU 4GB cần ngoài PEFT/TRL (cùng phiên bản với env gốc)
    "diffusers==0.41.0",
    "ultralytics==8.4.178",
    "opencv-python-headless==5.0.0.93",
    "tokenizers==0.23.3",
    "tiktoken==0.14.0",
    "faster-whisper==1.2.1",
    "gguf==0.19.0",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
# Phụ thuộc gián tiếp phát hành < 2 tuần trước 2026-10-30: chặn ở bản cũ hơn (bỏ dòng này khi đã đủ 2 tuần)
constraint-dependencies = [
    "av<=19.0.1",
    "certifi<=2026.7.22",
    "ctranslate2<=4.8.3",
    "fonttools<=4.67.0",
    "importlib-metadata<=9.0.1",
    "onnxruntime<=1.31.0",
    "polars<=2.0.0",
    "polars-runtime-32<=2.0.0",
    "ultralytics-platform<=0.1.89",
    "ultralytics-thop<=2.2.2",
    "zipp<=4.1.1",
]

# CUDA 12.6 (cu126): chạy tốt trên driver >= 525 (laptop đang driver 550 = CUDA 12.4 tối đa,
# cu130 cần driver >= 580 nên không dùng). RTX 30xx = Ampere sm_86, cu126 hỗ trợ đầy đủ.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
