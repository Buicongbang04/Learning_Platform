apiVersion: apps/v1
kind: Deployment
metadata:
  name: git
  namespace: devops-git
  labels:
    app.kubernetes.io/name: git
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: git
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: git
          image: quay.io/argoproj/argocd:v3.5.6
          imagePullPolicy: Never
          command:
            - git
            - daemon
            - --base-path=/srv/git
            - --export-all
            - --reuseaddr
            - --informative-errors
            - --port=9418
            - /srv/git
          env:
            - name: HOME
              value: /tmp
            - name: GIT_CONFIG_NOSYSTEM
              value: "1"
          ports:
            - name: git
              containerPort: 9418
          readinessProbe:
            tcpSocket:
              port: 9418
            periodSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: repos
              mountPath: /srv/git
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: repos
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: git
  namespace: devops-git
  labels:
    app.kubernetes.io/name: git
spec:
  selector:
    app.kubernetes.io/name: git
  ports:
    - name: git
      port: 9418
      targetPort: git
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: git-only-from-repo-server
  namespace: devops-git
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: git
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-repo-server
      ports:
        - port: 9418
          protocol: TCP
