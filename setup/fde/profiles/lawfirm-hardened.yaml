description: Công ty luật (máy siết bảo mật) — Rocky Linux 8, SELinux enforcing, không sudo, không ra internet; Podman rootless, linger đã bật cho fde nhưng podman.socket của user chưa bật; có registry nội bộ.
image: rocky-8
disk_gb: 20
sudo: false
egress: none
tls_inspection: false
selinux: enforcing
runtime: podman
services: [registry]
memory_mb: 5120
facts:
  kernel_major: "4.18"
  glibc: "2.28"
  disk_free_gb_max: 18
  gpu: null
