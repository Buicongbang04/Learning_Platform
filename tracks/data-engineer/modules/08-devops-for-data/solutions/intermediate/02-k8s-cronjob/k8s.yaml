apiVersion: v1
kind: ConfigMap
metadata:
  name: olist-ingest-config
  namespace: data
data:
  TARGET_SCHEMA: staging
  BATCH_SIZE: "5000"
---
apiVersion: v1
kind: Secret
metadata:
  name: olist-db
  namespace: data
type: Opaque
stringData:
  DB_PASSWORD: dev-only-change-me
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: olist-ingest
  namespace: data
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: ingest
              image: ghcr.io/acme/olist-ingest:1.4.0
              envFrom:
                - configMapRef:
                    name: olist-ingest-config
                - secretRef:
                    name: olist-db
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
