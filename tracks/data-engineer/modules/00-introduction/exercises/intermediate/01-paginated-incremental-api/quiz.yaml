- id: gr-b
  kind: data
  type: single
  prompt: Hệ số b của luật Gutenberg–Richter ước lượng trên dữ liệu khoảng bao nhiêu?
  options:
  - id: a
    text: Khoảng 0,7
  - id: b
    text: Khoảng 1,1
  - id: c
    text: Khoảng 1,6
  - id: d
