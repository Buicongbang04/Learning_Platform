questions:
- id: watermark-column
  kind: knowledge
  type: single
  prompt: Vì sao watermark incremental phải theo `updated` chứ không theo `time`?
  options:
  - id: a
    text: Vì `time` không có trong response JSON, chỉ `updated` được trả về cùng mỗi trận
  - id: b
    text: Vì `updated` luôn tăng đều theo `time`, nên lọc theo `updated` gọn hơn mà không mất gì
  - id: c
    text: Vì trận cũ vẫn bị sửa (độ lớn, vị trí); lọc theo `time` sẽ bỏ sót bản sửa
  - id: d
    text: Vì USGS không cho lọc theo `time` khi phân trang bằng `offset`
- id: state-when
  kind: knowledge
  type: single
  prompt: '`state.json` (watermark) nên được ghi khi nào?'
  options:
  - id: a
    text: Trước khi gọi trang đầu tiên, để đánh dấu lượt chạy
  - id: b
    text: Sau mỗi trang ghi xong
  - id: c
    text: Khi gặp lỗi, để lượt sau chạy tiếp từ chỗ hỏng
  - id: d
    text: Chỉ khi mọi trang của lượt chạy đã ghi xong
- id: pagination-stop
  kind: knowledge
  type: single
  prompt: '`fetch_pages` dừng duyệt `offset` khi nào?'
  options:
  - id: a
    text: Khi trang trả về ít bản ghi hơn `page_size`
  - id: b
    text: Khi server trả 404 cho `offset` vượt quá dữ liệu
  - id: c
    text: Sau đúng 7 trang, vì mỗi ngày có tối đa 7 trang
  - id: d
    text: Khi `offset` vượt 10 000 bản ghi đã đọc
- id: merge-runs
  kind: knowledge
  type: single
  prompt: Gộp nhiều lượt chạy, cùng một `id` xuất hiện ở lượt 1 và lượt 2. `load_events` giữ bản nào?
  options:
  - id: a
    text: Bản có `updated` mới nhất
  - id: b
    text: Bản ở lượt 1 (bản đầu tiên)
  - id: c
    text: Cả hai bản
  - id: d
    text: Bản có `mag` lớn hơn
- id: largest-quake
  kind: data
  type: single
  prompt: Trận M ≥ 4.5 lớn nhất năm 2024 trong dữ liệu là trận nào?
  options:
  - id: a
    text: M7,5 bán đảo Noto (Nhật Bản), 2024-01-01
  - id: b
    text: M7,4 Hoa Liên (Đài Loan), 2024-04-02
  - id: c
    text: M7,3 Vanuatu, 2024-12-17
  - id: d
    text: M7,0 ngoài khơi Cape Mendocino (California), 2024-12-05
- id: busiest-month
  kind: data
  type: single
  prompt: Tháng nào năm 2024 có nhiều trận M ≥ 4.5 nhất?
  options:
  - id: a
    text: Tháng 1
  - id: b
    text: Tháng 4
  - id: c
    text: Tháng 8
  - id: d
    text: Tháng 12
- id: top-region
  kind: data
  type: single
  prompt: '`region` nào có nhiều trận nhất?'
  options:
  - id: a
    text: Japan
  - id: b
