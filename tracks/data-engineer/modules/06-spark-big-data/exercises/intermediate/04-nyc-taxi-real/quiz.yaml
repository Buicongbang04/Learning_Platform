questions:
- id: broadcast-why
  kind: knowledge
  type: single
  prompt: 'Join 83 triệu chuyến với bảng zone 265 dòng: vì sao broadcast join nhanh hơn sort-merge?'
  options:
  - id: a
    text: Bảng nhỏ được gửi nguyên tới mọi executor nên không phải shuffle bảng lớn
  - id: b
    text: Broadcast sắp xếp trước cả hai bảng nên merge nhanh hơn
  - id: c
    text: Broadcast cache bảng lớn vào bộ nhớ driver
  - id: d
    text: Broadcast bỏ qua các dòng không khớp khoá trước khi đọc
- id: one-file-per-day
  kind: knowledge
  type: single
  prompt: Ghi `partitionBy("pickup_date")` mà mỗi ngày đúng một tệp, vẫn ghi song song nhiều task. Làm gì trước khi ghi?
  options:
  - id: a
    text: '`coalesce(1)`'
  - id: b
    text: '`repartition(200)`'
  - id: c
    text: '`repartition("pickup_date")`'
  - id: d
    text: Không cần gì, Spark tự gom
- id: pruning
  kind: knowledge
  type: single
  prompt: Đọc chuyến ngày 2019-07-04 từ dữ liệu đã partition nhanh hơn hẳn đọc từ tệp gốc chủ yếu vì?
  options:
  - id: a
    text: Dữ liệu partition được nén zstd
  - id: b
    text: 'Partition pruning: chỉ đọc thư mục `pickup_date=2019-07-04`'
  - id: c
    text: Spark cache sẵn lần đọc trước
  - id: d
    text: Broadcast bảng zone
- id: wide-ops
  kind: knowledge
  type: multi
  prompt: Phép nào là **wide transformation** (gây shuffle)?
  options:
