    text: '`groupBy(...).agg(...)`'
  - id: b
    text: '`filter(...)`'
  - id: c
    text: '`repartition("pickup_date")`'
  - id: d
    text: Join sort-merge hai bảng lớn
  - id: e
    text: '`withColumn(...)`'
