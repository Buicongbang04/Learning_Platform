rule_files:
  - eta.rules.yml

evaluation_interval: 1m

tests:
  - name: lỗi 10% kéo dài thì EtaHighErrorRate bắn sau for
    interval: 1m
    input_series:
      - series: 'eta_requests_total{job="eta-api",instance="api:8000",status="200",variant="champion"}'
        values: "0+90x40"
      - series: 'eta_requests_total{job="eta-api",instance="api:8000",status="500",variant="none"}'
        values: "0+10x40"
      - series: 'eta_model_info{job="eta-api",instance="api:8000",version="3",variant="champion"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 3m
        alertname: EtaHighErrorRate
        exp_alerts: []
      - eval_time: 15m
        alertname: EtaHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
              service: eta
            exp_annotations:
              summary: "Hơn 5% request /predict trả 5xx trong 5 phút"
              runbook_url: "https://github.com/example/eta/blob/main/docs/runbook.md#etahigherrorrate"
      - eval_time: 15m
        alertname: EtaMetricsAbsent
        exp_alerts: []

  - name: không có traffic thì không bắn lỗi (0/0), không bắn absent
    interval: 1m
    input_series:
      - series: 'eta_requests_total{job="eta-api",instance="api:8000",status="200",variant="champion"}'
        values: "0+0x40"
      - series: 'eta_requests_total{job="eta-api",instance="api:8000",status="500",variant="none"}'
        values: "0+0x40"
      - series: 'eta_request_duration_seconds_bucket{job="eta-api",instance="api:8000",variant="champion",le="0.3"}'
        values: "0+0x40"
      - series: 'eta_request_duration_seconds_bucket{job="eta-api",instance="api:8000",variant="champion",le="+Inf"}'
        values: "0+0x40"
      - series: 'eta_model_info{job="eta-api",instance="api:8000",version="3",variant="champion"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: EtaHighErrorRate
        exp_alerts: []
      - eval_time: 30m
        alertname: EtaHighLatencyP95
        exp_alerts: []
      - eval_time: 30m
        alertname: EtaMetricsAbsent
        exp_alerts: []

  - name: API mất hẳn thì EtaMetricsAbsent bắn, EtaHighErrorRate không
    interval: 1m
    input_series:
      - series: 'eta_requests_total{job="eta-api",instance="api:8000",status="200",variant="champion"}'
        values: "0+90x10 stale"
      - series: 'eta_model_info{job="eta-api",instance="api:8000",version="3",variant="champion"}'
        values: "1x10 stale"
    alert_rule_test:
      - eval_time: 5m
        alertname: EtaMetricsAbsent
        exp_alerts: []
      - eval_time: 25m
        alertname: EtaMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service: eta
              job: eta-api
            exp_annotations:
              summary: "Không còn thấy eta_model_info: API chết, chưa nạp model hoặc Prometheus không scrape được"
              runbook_url: "https://github.com/example/eta/blob/main/docs/runbook.md#etametricsabsent"
      - eval_time: 25m
        alertname: EtaHighErrorRate
        exp_alerts: []

  - name: p95 trên 0.3 giây suốt 10 phút
    interval: 1m
    input_series:
      - series: 'eta_request_duration_seconds_bucket{job="eta-api",instance="api:8000",variant="champion",le="0.1"}'
        values: "0+10x40"
      - series: 'eta_request_duration_seconds_bucket{job="eta-api",instance="api:8000",variant="champion",le="0.3"}'
        values: "0+20x40"
      - series: 'eta_request_duration_seconds_bucket{job="eta-api",instance="api:8000",variant="champion",le="0.5"}'
        values: "0+100x40"
      - series: 'eta_request_duration_seconds_bucket{job="eta-api",instance="api:8000",variant="champion",le="+Inf"}'
        values: "0+100x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: EtaHighLatencyP95
        exp_alerts: []
      - eval_time: 25m
        alertname: EtaHighLatencyP95
        exp_alerts:
          - exp_labels:
              severity: warning
              service: eta
            exp_annotations:
              summary: "p95 thời gian xử lý /predict trên 0.3 giây suốt 10 phút"
              runbook_url: "https://github.com/example/eta/blob/main/docs/runbook.md#etahighlatencyp95"

  - name: trung vị dự đoán giảm 44% so với 7 ngày trước
    interval: 30m
    input_series:
      - series: 'eta_prediction_seconds_bucket{job="eta-api",instance="api:8000",variant="champion",le="300"}'
        values: "0+2x336 678+6x80"
      - series: 'eta_prediction_seconds_bucket{job="eta-api",instance="api:8000",variant="champion",le="600"}'
        values: "0+8x336 2697+9x80"
      - series: 'eta_prediction_seconds_bucket{job="eta-api",instance="api:8000",variant="champion",le="900"}'
        values: "0+10x336 3370+10x80"
      - series: 'eta_prediction_seconds_bucket{job="eta-api",instance="api:8000",variant="champion",le="+Inf"}'
        values: "0+10x336 3370+10x80"
    alert_rule_test:
      - eval_time: 160h
        alertname: EtaPredictionShift
        exp_alerts: []
      - eval_time: 200h
        alertname: EtaPredictionShift
        exp_alerts:
          - exp_labels:
              severity: warning
              service: eta
            exp_annotations:
              summary: "Trung vị ETA dự đoán lệch hơn 30% so với cùng giờ 7 ngày trước"
              runbook_url: "https://github.com/example/eta/blob/main/docs/runbook.md#etapredictionshift"
