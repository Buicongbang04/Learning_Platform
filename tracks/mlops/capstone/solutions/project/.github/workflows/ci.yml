name: ci
on:
  push:
    paths: ["src/**", "tests_own/**", "pyproject.toml", "requirements-*.txt", "Dockerfile.*", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests_own/**", "pyproject.toml", "requirements-*.txt", "Dockerfile.*", ".github/workflows/ci.yml"]

permissions:
  contents: read

env:
  PYTHONPATH: .ci-deps:src
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Dependency
        run: test -d .ci-deps || python -m pip install --quiet --target .ci-deps -r requirements-ci.txt
      - name: Ruff
        run: python -m ruff check --no-cache src tests_own

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Dependency
        run: test -d .ci-deps || python -m pip install --quiet --target .ci-deps -r requirements-ci.txt
      - name: Pytest
        run: python -m pytest tests_own -q -p no:cacheprovider

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Dependency
        run: test -d .ci-deps || python -m pip install --quiet --target .ci-deps -r requirements-ci.txt
      - name: Đóng gói và chạy thử
        run: |
          mkdir -p dist
          python -m zipapp src -o dist/eta.pyz -m "eta.cli:main"
          python dist/eta.pyz --help > /dev/null
          sha256sum dist/eta.pyz | tee dist/eta.pyz.sha256
