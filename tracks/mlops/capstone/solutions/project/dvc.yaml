stages:
  prepare:
    foreach: ${months}
    do:
      cmd: PYTHONPATH=src python -m eta.cli prepare --config params.yaml --month ${item} --out data/interim/${item}.parquet
      deps:
        - ${data_dir}/yellow_tripdata_${item}.parquet
        - src/eta/data.py
      params:
        - sample_rows
        - seed
      outs:
        - data/interim/${item}.parquet
  validate:
    foreach: ${months}
    do:
      cmd: PYTHONPATH=src python -m eta.cli validate data/interim/${item}.parquet --month ${item} --report reports/validation/${item}.json
      deps:
        - data/interim/${item}.parquet
        - src/eta/validate.py
      outs:
        - reports/validation/${item}.json:
            cache: false
  train:
    cmd: PYTHONPATH=src python -m eta.cli train --config params.yaml --input data/interim --model-out models/model.joblib --metrics-out metrics.json
    deps:
      - data/interim
      - reports/validation
      - src/eta/features.py
      - src/eta/train.py
      - src/eta/cli.py
    params:
      - months
      - model_params
      - seed
    outs:
      - models/model.joblib
    metrics:
      - metrics.json:
          cache: false
