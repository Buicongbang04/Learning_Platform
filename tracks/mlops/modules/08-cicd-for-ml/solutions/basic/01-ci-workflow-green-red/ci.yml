name: ci
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: .ci-tools/bin/ruff check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pytest tests -q -p no:cacheprovider
        env:
          PYTHONPATH: .ci-tools

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - run: |
          mkdir -p dist
          python -m zipapp src -o dist/etalite.pyz -m "etalite.cli:main"
