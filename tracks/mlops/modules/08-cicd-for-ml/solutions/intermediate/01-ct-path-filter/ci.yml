name: ci
on:
  push:
    paths: ["src/**", "tests/**", "pyproject.toml", "train.py", "gate.py"]
  pull_request:
    paths: ["src/**", "tests/**", "pyproject.toml", "train.py", "gate.py"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: .ci-tools/bin/ruff check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pytest tests -q -p no:cacheprovider
        env:
          PYTHONPATH: .ci-tools

