name: ct
on:
  push:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - run: python train.py

  gate:
    runs-on: ubuntu-latest
    needs: train
    steps:
      - run: python gate.py --min-improvement 0.01

  deploy:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - name: Đẩy model lên registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "thiếu REGISTRY_TOKEN" >&2
            exit 1
          fi
          mkdir -p registry
          cp models/model.json registry/model.json
          echo "DEPLOYED $(python -c 'import json; print(json.load(open("registry/model.json"))["model_id"])')"
