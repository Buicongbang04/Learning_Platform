[project]
name = "eta-mini"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "scikit-learn>=1.5", "pyarrow>=15", "joblib>=1.4"]

[project.scripts]
eta-train = "eta_mini.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
