apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: eta
  annotations:
    serving.kserve.io/autoscalerClass: none
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: eta-serve:dev
        imagePullPolicy: IfNotPresent
        env:
          - name: MODEL_NAME
            value: eta
          - name: MODEL_PATH
            value: /models/eta-v2.joblib
        ports:
          - containerPort: 8080
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /v1/models/eta
            port: 8080
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
