apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: eta-stable
  annotations:
    serving.kserve.io/autoscalerClass: none
spec:
  predictor:
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      seccompProfile:
        type: RuntimeDefault
    minReplicas: 3
    maxReplicas: 3
    labels:
      eta-traffic: "on"
    containers:
      - name: kserve-container
        image: eta-serve:dev
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        env:
          - name: MODEL_PATH
            value: /models/eta-v1.joblib
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: "1"
            memory: 512Mi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: eta-canary
  annotations:
    serving.kserve.io/autoscalerClass: none
spec:
  predictor:
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      seccompProfile:
        type: RuntimeDefault
    minReplicas: 1
    maxReplicas: 1
    labels:
      eta-traffic: "on"
    containers:
      - name: kserve-container
        image: eta-serve:dev
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        env:
          - name: MODEL_PATH
            value: /models/eta-v2.joblib
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: "1"
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eta
spec:
  selector:
    eta-traffic: "on"
  ports:
    - port: 80
      targetPort: 8080
