apiVersion: apps/v1
kind: Deployment
metadata:
  name: eta-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eta-api
  template:
    metadata:
      labels:
        app: eta-api
    spec:
      containers:
        - name: api
          image: eta-serve:dev
          env:
            - name: MODEL_PATH
              value: /models/eta-v1.joblib
            - name: MODEL_FETCH_SECONDS
              value: "40"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
