apiVersion: v1
kind: ConfigMap
metadata:
  name: eta-api-config
data:
  MODEL_NAME: eta
  MODEL_PATH: /models/eta-v2.joblib
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eta-api
  labels:
    app: eta-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eta-api
  template:
    metadata:
      labels:
        app: eta-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: eta-serve:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: eta-api-config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eta-api
spec:
  selector:
    app: eta-api
  ports:
    - name: http
      port: 80
      targetPort: http
