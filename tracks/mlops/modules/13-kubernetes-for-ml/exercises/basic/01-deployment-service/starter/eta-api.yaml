apiVersion: v1
kind: ConfigMap
metadata:
  name: eta-api-config
data:
  MODEL_NAME: eta
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eta-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eta-api
  template:
    metadata:
      labels:
        app: eta-api
    spec:
      containers:
        - name: api
          image: eta-serve:dev
---
apiVersion: v1
kind: Service
metadata:
  name: eta-api
spec:
  selector:
    app: eta-api
  ports:
    - port: 80
