apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: eta-stable
  annotations:
    serving.kserve.io/autoscalerClass: none
spec:
  predictor:
    minReplicas: 3
    maxReplicas: 3
    containers:
      - name: kserve-container
        image: eta-serve:dev
        env:
          - name: MODEL_PATH
            value: /models/eta-v1.joblib
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: "1"
            memory: 512Mi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: eta-canary
  annotations:
    serving.kserve.io/autoscalerClass: none
spec:
  predictor:
    canaryTrafficPercent: 25
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: eta-serve:dev
        env:
          - name: MODEL_PATH
            value: /models/eta-v2.joblib
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: "1"
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eta
spec:
  selector:
    app: isvc.eta-stable-predictor
  ports:
    - port: 80
      targetPort: 8080
