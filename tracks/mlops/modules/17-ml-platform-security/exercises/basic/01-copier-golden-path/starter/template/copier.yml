_min_copier_version: "9.0"
_subdirectory: project
_templates_suffix: .jinja

project_name:
  type: str
  help: Tên dự án model, viết tự do (vd. Tip Amount)

project_slug:
  type: str
  help: Tên ngắn dạng kebab-case, dùng trong tên model trên registry
  default: "{{ project_name | lower }}"

team:
  type: str
  help: Đội sở hữu model

model_kind:
  type: str
  help: Loại bài toán
  default: regression

