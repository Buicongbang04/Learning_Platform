apiVersion: v1
kind: ResourceQuota
metadata:
  name: serving-quota
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "10"
    requests.__GPU__: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: serving-defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 256Mi
      max:
        memory: 1Gi
