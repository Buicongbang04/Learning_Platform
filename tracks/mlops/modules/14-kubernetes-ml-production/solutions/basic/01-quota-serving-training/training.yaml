apiVersion: v1
kind: ResourceQuota
metadata:
  name: training-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 16Gi
    requests.__GPU__: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: training-defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      default:
        cpu: "1"
        memory: 1Gi
      max:
        memory: 4Gi
