questions:
  - id: slim-vs-full
    kind: knowledge
    type: single
    prompt: "Service sklearn nhỏ cần numpy, scipy và scikit-learn. Chọn base image nào cho production?"
    options:
      - id: a
        text: "python:3.12 (bản đầy đủ): có sẵn gcc và header nên cài được mọi thứ, dung lượng không đáng kể với một service"
      - id: b
        text: "python:3.12-alpine: base nhỏ nhất, numpy và scipy đều có wheel musl nên cài nhanh, scikit-learn cũng vậy"
      - id: c
        text: "python:3.12.11-slim, cài wheel bằng pip và chạy bằng user thường"
      - id: d
        text: "ubuntu:24.04 rồi apt install python3-pip, để giống môi trường trên máy dev của đội"
  - id: layer-order
    kind: knowledge
    type: single
    prompt: "Sửa một dòng trong app/serve.py mà lần build nào cũng cài lại 250 MB dependency. Nguyên nhân thường gặp nhất là gì?"
    options:
      - id: a
        text: "Thiếu HEALTHCHECK nên Docker không xác định được layer nào còn dùng lại được sau khi code đổi"
      - id: b
        text: "COPY toàn bộ source đứng trước RUN pip install nên layer cài đặt mất cache"
      - id: c
        text: "Multi-stage build xoá cache của stage đầu sau mỗi lần build, nên stage cuối luôn phải cài lại"
      - id: d
        text: "pip install thiếu cờ --user nên pip không ghi được vào thư mục cache và phải tải lại"
  - id: model-in-image
    kind: knowledge
    type: single
    prompt: "Model được retrain mỗi tuần, file 80 MB, image service 500 MB. Đánh đổi nào đúng nhất giữa đóng model vào image và mount từ volume hoặc object storage?"
    options:
      - id: a
        text: "Mount ngoài: image giữ nguyên nên rollback và kiểm toán đơn giản hơn, vì file model khớp với code"
      - id: b
        text: "Hai cách vận hành như nhau, chỉ khác chỗ lưu file, vì model 80 MB nhỏ hơn nhiều phần dependency"
      - id: c
        text: "Đóng vào image: tránh được điểm hỏng lúc khởi động, nên không cần theo dõi version model riêng"
      - id: d
        text: "Đóng vào image: version model gắn với image tag nên rollback và tái lập đơn giản, đổi lại mỗi lần retrain phải build và đẩy image mới"
  - id: ml-image-size
    kind: knowledge
    type: multi
    prompt: "Những việc nào thật sự làm image ML nhỏ đi hoặc build nhanh hơn?"
    options:
      - id: a
        text: "pip install --no-cache-dir"
      - id: b
        text: "Multi-stage: chỉ chép venv đã cài sang stage cuối"
      - id: c
        text: "Dùng .dockerignore để loại data và notebook khỏi build context"
      - id: d
        text: "Thêm nhãn LABEL maintainer vào cuối Dockerfile"
  - id: root-user
    kind: knowledge
    type: single
    prompt: "Vì sao nên thêm USER không phải root trong image của service dự đoán?"
    options:
      - id: a
        text: "Để service chạy nhanh hơn, vì kernel bỏ bớt các bước kiểm tra quyền với tiến trình không phải root"
      - id: b
        text: "Để Docker tự bật healthcheck và tự restart container khi service trả lỗi 5xx liên tục"
      - id: c
        text: "Giảm thiệt hại nếu service bị khai thác: kẻ tấn công không có sẵn quyền root trong container"
      - id: d
        text: "Để image nhỏ hơn, vì Docker bỏ được các thư viện hệ thống chỉ dành cho tiến trình chạy bằng root"
  - id: cuda-base
    kind: knowledge
    type: single
    prompt: "Máy dev chỉ có CPU, production sẽ có GPU NVIDIA. Cách làm hợp lý cho image inference?"
    options:
      - id: a
        text: "Cài driver NVIDIA vào trong image để container dùng được GPU của máy chủ, rồi dùng chung đúng một image đó cho cả dev lẫn production ở mọi máy"
      - id: b
        text: "Một Dockerfile, build-arg chọn base (slim hoặc nvidia/cuda runtime); driver nằm ở host và được đưa vào bằng NVIDIA Container Toolkit"
      - id: c
        text: "Dùng nvidia/cuda devel làm base cho cả dev lẫn production, vì nó chạy được ở cả hai nên khỏi phân nhánh"
      - id: d
        text: "Build riêng trên máy production vì image GPU quá lớn để đẩy lên registry"
