services:
  mlflow:
    build: ./mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --allowed-hosts "mlflow:5000,localhost:*,127.0.0.1:*"
      --backend-store-uri /mlflow-data/mlruns
      --default-artifact-root /mlflow-data/artifacts
    environment:
      MLFLOW_ALLOW_FILE_STORE: "true"
    volumes:
      - mlflow-data:/mlflow-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "5000"

  api:
    build: ./service
    env_file: api.env
    volumes:
      - ./models:/models:ro
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "8000"

volumes:
  mlflow-data:
