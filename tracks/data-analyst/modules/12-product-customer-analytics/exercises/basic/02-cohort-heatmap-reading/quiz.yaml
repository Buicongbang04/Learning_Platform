questions:
  - id: lowest-m1
    kind: data
    type: single
    prompt: "Cohort nào có retention tháng 1 (k = 1) thấp nhất?"
    options:
      - { id: a, text: "Cohort 12/2010 (9.2%)" }
      - { id: b, text: "Cohort 05/2010 (15.7%)" }
      - { id: c, text: "Cohort 07/2010 (15.6%)" }
      - { id: d, text: "Cohort 01/2011 (16.9%)" }
  - id: why-lowest
    kind: knowledge
    type: single
    prompt: "Vì sao cohort đó có m1 thấp như vậy?"
    options:
      - { id: a, text: "Tháng 1 của nó là tháng 1/2011, ngay sau mùa đặt hàng Giáng sinh" }
      - { id: b, text: "Cohort đó nhỏ nhất nên tỉ lệ dao động mạnh nhất trong bảng" }
      - { id: c, text: "Chiến dịch acquisition tháng đó kéo về khách chất lượng thấp" }
      - { id: d, text: "Ô đó chưa quan sát đủ nên bị điền 0 thay cho giá trị thật" }
  - id: dark-months
    kind: data
    type: single
    prompt: "Trong calendar view, ở những tháng lịch nào gần như mọi cohort cùng tối đi (retention thấp)?"
    options:
      - { id: a, text: "05/2010-07/2010" }
      - { id: b, text: "09/2010-11/2010" }
      - { id: c, text: "09/2011-11/2011" }
      - { id: d, text: "12/2010-02/2011" }
  - id: weighted-k1
    kind: data
    type: single
    prompt: "Đường retention trung bình có trọng số theo cỡ cohort ở k = 1 là bao nhiêu?"
    options:
      - { id: a, text: "20.6%" }
      - { id: b, text: "21.5%" }
      - { id: c, text: "23.4%" }
      - { id: d, text: "35.3%" }
  - id: last-point
    kind: data
    type: single
    prompt: "Với min_cohorts = 3, điểm cuối cùng còn giá trị trên đường trung bình là k bằng bao nhiêu?"
    options:
      - { id: a, text: "k = 12" }
      - { id: b, text: "k = 21" }
      - { id: c, text: "k = 22" }
      - { id: d, text: "k = 23" }
  - id: dec09-high
    kind: knowledge
    type: single
    prompt: "Cohort 12/2009 có m1 35.3%, cao hơn hẳn mọi cohort khác. Giải thích hợp lý nhất là gì?"
    options:
      - { id: a, text: "Cửa hàng chạy chương trình thành viên ngay từ tháng 12/2009" }
      - { id: b, text: "Cohort càng lớn thì retention càng cao, theo luật số lớn" }
      - { id: c, text: "Dữ liệu bắt đầu 12/2009 nên cohort đó gồm cả khách lâu năm" }
      - { id: d, text: "Tháng 1/2010 là mùa cao điểm nên mọi khách đều quay lại" }
  - id: yoy-cohorts
    kind: data
    type: single
    prompt: "So m1 của cohort cùng tháng hai năm (2010 và 2011, tháng 1 tới tháng 10). Câu nào đúng?"
    options:
      - { id: a, text: "2011 cao hơn ở mọi tháng, và cohort 2011 cũng đông khách hơn" }
      - { id: b, text: "2011 cao hơn từ tháng 4 tới 10, thấp hơn ở tháng 1-3; cohort nhỏ hơn" }
      - { id: c, text: "2011 thấp hơn ở mọi tháng vì thị trường đã bão hoà sau năm đầu" }
      - { id: d, text: "Hai năm gần như bằng nhau, chênh dưới một điểm ở mọi tháng" }
  - id: blank-cell
    kind: knowledge
    type: single
    prompt: "Ô cohort 09/2011, k = 3 để trống trên heatmap. Nó có nghĩa là gì?"
    options:
      - { id: a, text: "Không khách nào của cohort mua lại ở tháng thứ 3" }
      - { id: b, text: "Cohort quá nhỏ nên ô bị ẩn đi để bảo vệ thông tin khách" }
      - { id: c, text: "Dữ liệu bị lỗi, cần điền bằng trung bình của cột" }
      - { id: d, text: "Chưa quan sát được: tháng thứ 3 của cohort chưa tới" }
