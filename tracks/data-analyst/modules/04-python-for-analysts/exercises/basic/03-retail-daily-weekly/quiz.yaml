questions:
  - id: closed-weekday
    kind: data
    type: single
    prompt: "Trong 374 ngày lịch, thứ nào trong tuần **không bao giờ** có đơn hợp lệ?"
    options:
      - { id: a, text: "Chủ nhật" }
      - { id: b, text: "Thứ Hai" }
      - { id: c, text: "Thứ Bảy" }
      - { id: d, text: "Không có thứ nào, ngày nào cũng có đơn" }
  - id: two-denominators
    kind: data
    type: single
    prompt: "Doanh thu trung bình mỗi ngày tính theo ngày lịch và theo ngày có bán là bao nhiêu?"
    options:
      - { id: a, text: "28.5 và 35.0 nghìn GBP" }
      - { id: b, text: "Cùng 28.5 nghìn GBP, không chênh" }
      - { id: c, text: "35.0 và 41.1 nghìn GBP" }
      - { id: d, text: "24.4 và 28.5 nghìn GBP" }
  - id: non-saturday-zero
    kind: data
    type: single
    prompt: "Ngoài thứ Bảy, có bao nhiêu ngày không có đơn, và chúng là gì?"
    options:
      - { id: a, text: "Không có ngày nào ngoài thứ Bảy" }
      - { id: b, text: "16 ngày: nghỉ Giáng sinh và các ngày lễ" }
      - { id: c, text: "53 ngày: toàn bộ các Chủ nhật" }
      - { id: d, text: "6 ngày: các thứ Hai đầu tháng sau kỳ lương" }
  - id: weakest-open-day
    kind: data
    type: single
    prompt: "Trong các thứ cửa hàng có nhận đơn, thứ nào có doanh thu trung bình thấp nhất (tính trên mọi ngày của thứ đó)?"
    options:
      - { id: a, text: "Thứ Hai" }
      - { id: b, text: "Thứ Sáu" }
      - { id: c, text: "Thứ Tư và thứ Sáu" }
      - { id: d, text: "Chủ nhật" }
  - id: best-week
    kind: data
    type: single
    prompt: "Tuần có doanh thu cao nhất trong `weekly_report` là tuần nào, và có nên gọi nó là \"tuần kỷ lục\" không?"
    options:
      - { id: a, text: "Tuần 20/11/2011, đủ 7 ngày: đúng là kỷ lục" }
      - { id: b, text: "Tuần 12/12/2010: mùa Giáng sinh, kỷ lục thật" }
      - { id: c, text: "Tuần 25/09/2011: nhờ một khách sỉ mới" }
      - { id: d, text: "Tuần 11/12/2011: chưa đủ tuần, có đơn bị huỷ" }
  - id: zero-week
    kind: data
    type: single
    prompt: "Tuần kết thúc 02/01/2011 đủ 7 ngày lịch nhưng doanh thu bằng 0. Nên xử lý thế nào trong đường xu hướng 4 tuần?"
    options:
      - { id: a, text: "Giữ, ghi chú tuần nghỉ lễ, so cùng kỳ năm trước" }
      - { id: b, text: "Xoá tuần đó khỏi dữ liệu gốc để chart trông đẹp hơn" }
      - { id: c, text: "Thay bằng trung bình của 52 tuần còn lại" }
      - { id: d, text: "Báo lỗi dữ liệu cho team Data Engineer" }
  - id: resample-zero
    kind: knowledge
    type: single
    prompt: "`resample(\"D\").sum()` trả 0 cho ngày không có dòng giao dịch. Điều đó có nghĩa gì?"
    options:
      - { id: a, text: "Ngày đó chắc chắn có mở cửa nhưng không bán được đơn nào" }
      - { id: b, text: "pandas không biết vì sao không có dòng: bạn phải biết" }
      - { id: c, text: "Ngày đó bị lỗi dữ liệu, phải bỏ khỏi bảng" }
      - { id: d, text: "pandas đã tự nội suy giá trị cho ngày đó" }
  - id: rolling-on-transactions
    kind: knowledge
    type: single
    prompt: "Đồng nghiệp tính \"trung bình 7 ngày\" bằng `sales.revenue.rolling(7).mean()` trên bảng dòng giao dịch. Sai ở đâu?"
    options:
      - { id: a, text: "rolling chỉ dùng được với dữ liệu theo giờ" }
      - { id: b, text: "Phải dùng rolling(4) vì một tháng có 4 tuần" }
      - { id: c, text: "Cửa sổ là 7 dòng hàng, không phải 7 ngày" }
      - { id: d, text: "Không sai, kết quả giống trên chuỗi ngày" }
