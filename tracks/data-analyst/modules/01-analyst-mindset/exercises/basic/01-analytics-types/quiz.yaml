      - { id: a, text: "Descriptive (mô tả)" }
      - { id: b, text: "Diagnostic (chẩn đoán)" }
      - { id: c, text: "Predictive (dự báo)" }
      - { id: d, text: "Prescriptive (đề xuất)" }
