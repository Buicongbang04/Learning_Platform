    kind: knowledge
    type: single
    prompt: "Trưởng nhóm marketing hỏi: \"Tháng trước có bao nhiêu khách mới đăng ký, chia theo từng kênh (Facebook, Google, giới thiệu)?\" Đây là loại analytics nào?"
