questions:
  - id: fixed-threshold
    kind: data
    type: single
    prompt: "Quy tắc cũ \"dưới 2 000 lượt thì báo\" báo bao nhiêu ngày trong hai năm, và rơi vào đâu?"
    options:
      - { id: a, text: "39 ngày, rải đều mọi tháng" }
      - { id: b, text: "98 ngày, khoảng 3/4 vào tháng 1–3" }
      - { id: c, text: "98 ngày, phần lớn rơi vào tháng 6–8" }
      - { id: d, text: "12 ngày, hầu hết vào tháng 12" }
  - id: seasonal-count
    kind: data
    type: single
    prompt: "Quy tắc mùa vụ (|score| > 4) báo bao nhiêu ngày, gộp lại thành bao nhiêu đợt?"
    options:
      - { id: a, text: "39 ngày, 26 đợt" }
      - { id: b, text: "58 ngày, 39 đợt" }
      - { id: c, text: "65 ngày, 65 đợt" }
      - { id: d, text: "25 ngày, 11 đợt" }
  - id: worst-day
    kind: data
    type: single
    prompt: "Score âm nhất (khoảng −58) rơi vào 29/10/2012, ngày bão Sandy, với 22 lượt thuê. Kiểm `hour_coverage` thấy gì, và nên báo thế nào?"
    options:
      - { id: a, text: "Đủ 24 giờ; báo khẩn: cầu giảm 99% vì bão" }
      - { id: b, text: "Đủ 24 giờ; bỏ qua vì bão là chuyện ai cũng biết" }
      - { id: c, text: "Chỉ 1 giờ dữ liệu; báo là ngày thiếu giờ, kiểm nguồn" }
      - { id: d, text: "Không có trong hour.csv; xoá ngày đó khỏi day.csv" }
  - id: investigate-share
    kind: data
    type: single
    prompt: "Trong 39 ngày cảnh báo, `triage(alerts, day, coverage)` (có kiểm độ phủ, như cell explore) gắn `investigate` (không thiếu giờ, không phải lễ, không phải `weathersit >= 3`) cho bao nhiêu ngày?"
    options:
      - { id: a, text: "3 ngày" }
      - { id: b, text: "23 ngày" }
      - { id: c, text: "39 ngày" }
      - { id: d, text: "25 ngày" }
  - id: christmas-2011
    kind: data
    type: single
    prompt: "25/12/2011 bị gắn `investigate` dù là Giáng sinh. Vì sao?"
    options:
      - { id: a, text: "Ngày đó trời xấu (weathersit 3) nên lẽ ra phải là bad_weather" }
      - { id: b, text: "Lễ rơi vào Chủ nhật, nghỉ bù thứ Hai 26/12 mới có holiday = 1" }
      - { id: c, text: "Bộ dữ liệu không có ngày 25/12/2011" }
      - { id: d, text: "Thứ tự ưu tiên trong triage đặt sai" }
  - id: past-only-scale
    kind: knowledge
    type: single
    prompt: "Vì sao thang đo (MAD) của ngày t chỉ tính trên các ngày trước t?"
    options:
      - { id: a, text: "Để code chạy nhanh hơn khi dữ liệu lớn" }
      - { id: b, text: "Vì MAD không tính được khi cửa sổ chứa cả ngày t đang xét" }
      - { id: c, text: "Để kết quả giống hệt quy tắc ngưỡng cố định" }
      - { id: d, text: "Ngày bất thường làm thang đo phình ra và tự che mình" }
  - id: day-over-day
    kind: knowledge
    type: single
    prompt: "Quy tắc \"giảm hơn 30% so với hôm qua\" báo 65 ngày. Lỗi chính của nó là gì?"
    options:
      - { id: a, text: "Hôm qua có thể chính là ngày bất thường, và thứ trong tuần khác nhau" }
      - { id: b, text: "Ngưỡng 30% quá thấp, chỉ cần tăng lên 50% là đủ" }
      - { id: c, text: "Nó chỉ phát hiện được cú tăng đột biến, không thấy được cú giảm mạnh" }
      - { id: d, text: "Nó cần ít nhất 4 tuần lịch sử mới bắt đầu chạy" }
  - id: spikes-sep-2012
    kind: knowledge
    type: single
    prompt: "Ba cảnh báo `spike` rơi vào tháng 9/2012, ngày đẹp trời. Nên xử lý thế nào?"
    options:
      - { id: a, text: "Báo khẩn cho Head of Operations như mọi cú giảm" }
      - { id: b, text: "Xoá các ngày đó khỏi dữ liệu vì chắc chắn là lỗi ghi nhận lượt thuê" }
      - { id: c, text: "Baseline 4 tuần trễ so với đà tăng; gửi riêng hoặc chỉ ghi nhận" }
      - { id: d, text: "Hạ ngưỡng xuống 3 để bắt thêm nhiều spike khác" }
