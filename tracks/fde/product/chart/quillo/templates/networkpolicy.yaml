{{- if .Values.networkPolicy.enabled }}
{{- $peers := dict "api" (list "db" "llm" "embed") "worker" (list "db" "embed") "db" (list) "llm" (list) "embed" (list) }}
{{- $ports := dict "db" 5432 "llm" 8080 "embed" 8080 }}
{{- $clients := dict "db" (list "api" "worker") "llm" (list "api") "embed" (list "api" "worker") }}
{{- range $component := list "api" "worker" "db" "llm" "embed" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "quillo.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quillo.selector" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if not (or (eq $component "api") (hasKey $clients $component)) }}
  ingress: []
  {{- else }}
  ingress:
    {{- if eq $component "api" }}
    - ports:
        - port: 8080
      {{- with $.Values.networkPolicy.apiFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- else if hasKey $clients $component }}
    - ports:
        - port: {{ index $ports $component }}
      from:
        {{- range $client := index $clients $component }}
        - podSelector:
            matchLabels:
              {{- include "quillo.selector" (dict "root" $ "component" $client) | nindent 14 }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- if not (index $peers $component) }}
  egress: []
  {{- else }}
  egress:
    {{- range $target := index $peers $component }}
    - ports:
        - port: {{ index $ports $target }}
      to:
        - podSelector:
            matchLabels:
              {{- include "quillo.selector" (dict "root" $ "component" $target) | nindent 14 }}
    {{- end }}
    {{- if index $peers $component }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    {{- end }}
    {{- if eq $component "api" }}
    {{- with $.Values.networkPolicy.apiExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
