{{- $component := dict "root" $ "component" "db" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quillo.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  serviceName: {{ .Release.Name }}-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "quillo.selector" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quillo.selector" $component | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "quillo.pullSecrets" . | nindent 6 }}
      {{- include "quillo.podSecurityContext" $component | nindent 6 }}
      containers:
        - name: db
          image: {{ include "quillo.image" (list $ .Values.image.db.repository .Values.image.db.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: quillo
            - name: POSTGRES_DB
              value: quillo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "quillo.authSecret" . }}
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "quillo", "-d", "quillo"]
            periodSeconds: 5
            timeoutSeconds: 5
          {{- include "quillo.containerExtras" $component | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quillo.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  selector:
    {{- include "quillo.selector" $component | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
