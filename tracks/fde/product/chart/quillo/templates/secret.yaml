{{- if not .Values.auth.existingSecret }}
{{- $name := printf "%s-auth" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quillo.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  admin-token: {{ index $existing.data "admin-token" }}
  db-password: {{ index $existing.data "db-password" }}
  {{- else }}
  admin-token: {{ randAlphaNum 40 | b64enc }}
  db-password: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
