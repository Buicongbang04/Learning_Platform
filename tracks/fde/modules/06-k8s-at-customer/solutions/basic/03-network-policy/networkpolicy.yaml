apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quillo-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: quillo
      app.kubernetes.io/instance: quillo
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lawfirm-gateway
      ports:
        - port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: quillo
              app.kubernetes.io/instance: quillo
              app.kubernetes.io/component: db
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [quillo]}
              - {key: app.kubernetes.io/instance, operator: In, values: [quillo]}
              - {key: app.kubernetes.io/component, operator: In, values: [llm, embed]}
      ports:
        - port: 8080
---
