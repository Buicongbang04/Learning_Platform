requests:
  r1:
    pillar: field
    module: 03-airgapped-proxy
    why: >-
      Lỗi chỉ xuất hiện ở máy của viện, không ở máy test: proxy công ty soi HTTPS bằng CA nội bộ mà container chưa
      trust. Đây là việc cài đặt tại hiện trường, không phải câu hỏi về scope hay giá trị.
    first_step: >-
      Xin khách output đầy đủ của lệnh lỗi và chạy cùng lệnh pip với curl -v trên host lẫn trong container để xem ai
      ký chứng chỉ mà client nhận được.
  r2:
    pillar: customer
    module: 13-business-roi
    why: >-
      COO không hỏi hệ thống chạy thế nào mà hỏi giá trị kinh doanh để quyết định ký mở rộng; câu trả lời là một mô
      hình ROI có baseline đo được, không phải một bản demo.
    first_step: >-
      Hẹn 30 phút với trưởng nhóm vận hành để đo baseline: mỗi tháng bao nhiêu yêu cầu, mỗi yêu cầu mất bao lâu, bao
      nhiêu phần trăm phải làm lại.
  r3:
    pillar: field
    module: 09-production-trust
    why: >-
      Nghe như chuyện giao tiếp nhưng thực chất khách cần bằng chứng kỹ thuật: bộ eval trên tài liệu của chính họ,
      đo groundedness và citation, cộng tiêu chí nghiệm thu trước khi mở cho 40 người.
    first_step: >-
      Xin 30–50 câu hỏi thật kèm đáp án do chính luật sư viết, dựng bộ eval chạy trên dữ liệu của khách và thống nhất
      ngưỡng đạt trước khi mở rộng.
  r4:
    pillar: customer
    module: 12-scoping-sequencing
    why: >-
      Ba tính năng, một hạn chót cứng và một buổi demo quan trọng: việc của FDE là tách cái khách thật sự cần cho buổi
      demo, sắp thứ tự và nói "không" hoặc "để sau" có lý do, chưa phải viết code ngay.
    first_step: >-
      Hỏi lại khách HĐQT cần thấy điều gì để ra quyết định, rồi gửi lại một đề xuất scope cho thứ Sáu có must, should
      và won't kèm rủi ro của từng mục.
  r5:
    pillar: design
    module: 18-system-design-fde
    why: >-
      Đây là bài thiết kế hệ thống có ràng buộc của khách: tách dữ liệu theo công ty con, phân quyền trong retrieval,
      ước lượng tải cho 2 triệu tài liệu và chỉ ra điểm nghẽn trước khi hứa.
    first_step: >-
      Ước lượng nhanh kích thước index, số truy vấn giờ cao điểm và hỏi rõ yêu cầu cô lập: chung cluster khác
      namespace hay mỗi công ty con một cài đặt riêng.
  r6:
    pillar: cloud
    module: 19-cloud-iac
    why: >-
      Khách muốn mô hình BYOC: hạ tầng nằm trong tài khoản AWS của họ, vendor chỉ có quyền qua role được cấp và thu
      hồi được, mọi thứ dựng bằng IaC để IT khách kiểm và tái lập.
    first_step: >-
      Viết danh sách quyền tối thiểu mà bản cài cần và gửi đội cloud của khách một bản nháp cross-account role kèm
      external ID để họ duyệt trước.
