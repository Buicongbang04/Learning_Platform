  - id: a
    text: BatchNorm 2.8e-01, GroupNorm 8.4e-07
  - id: b
    text: BatchNorm 8.4e-07, GroupNorm 2.8e-01
  - id: c
    text: Cả hai cỡ 1e-06, tức là tương đương
  - id: d
    text: Cả hai cỡ 0.3, accumulation luôn lệch
- id: ckpt-one-segment
  kind: knowledge
  type: single
  prompt: Checkpoint một đoạn duy nhất bao cả mạng giữ ít activation nhất, nhưng vì sao peak memory trên GPU gần như không giảm?
  options:
  - id: a
    text: Lúc backward chạy lại forward, mọi activation lại nằm trong bộ nhớ
  - id: b
    text: PyTorch tự tắt checkpoint khi chỉ có một đoạn duy nhất
  - id: c
    text: Gradient của tham số chiếm phần lớn bộ nhớ ở mọi cấu hình
  - id: d
    text: Caching allocator không trả lại bộ nhớ đã giải phóng
- id: accum-weight
  kind: knowledge
  type: single
  prompt: Batch 10, micro-batch tối đa 4 (4, 4, 2). Nhân loss của mỗi micro-batch với gì để gradient bằng gradient cả batch?
  options:
  - id: a
    text: 1/3, vì có 3 micro-batch
  - id: b
    text: Số mẫu của micro-batch chia 10
  - id: c
    text: 1, cộng dồn là đủ
  - id: d
    text: 1/4, theo cỡ micro-batch
- id: forward-peak
  kind: knowledge
  type: single
  prompt: Đo memory_allocated quanh một bước train ResNet-9 trên GPU. Đỉnh nằm ở đâu?
  options:
  - id: a
    text: Sau optimizer.step, vì AdamW tạo thêm hai moment
  - id: b
    text: Cuối forward, trước backward, khi activation còn đủ
  - id: c
    text: Ngay khi chuyển model lên GPU bằng .to(cuda)
  - id: d
    text: Sau zero_grad, vì gradient được cấp phát lại từ đầu
