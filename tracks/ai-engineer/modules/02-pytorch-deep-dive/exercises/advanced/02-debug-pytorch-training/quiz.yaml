    text: Gradient của cả batch, vì loss đã chia 2
  - id: b
    text: Gấp đôi gradient của cả batch
  - id: c
    text: Một nửa gradient của micro-batch cuối
  - id: d
    text: Bằng 0, vì zero_grad xoá hết trước step
