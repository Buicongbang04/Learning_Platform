questions:
- id: optimizer-params
  kind: data
  type: single
  prompt: Trong notebook gốc (chưa sửa), optimizer thấy bao nhiêu tham số của Net(16)?
  options:
  - id: a
    text: 1 114
  - id: b
    text: 78 042
  - id: c
    text: 76 928
  - id: d
    text: '0'
- id: loss-floor
  kind: data
  type: single
  prompt: Với 10 lớp, cross-entropy tính trên softmax(logits) có giá trị nhỏ nhất (khi model đúng tuyệt đối) là bao nhiêu?
  options:
  - id: a
    text: '0.0000'
  - id: b
    text: '1.4612'
  - id: c
    text: '2.3026'
  - id: d
    text: '0.6931'
- id: eval-symptom
  kind: data
  type: single
  prompt: Sau khi chạy notebook gốc, running_var của BatchNorm ở stem vẫn toàn số 1. Điều đó nói gì?
  options:
  - id: a
    text: Lr quá nhỏ nên γ, β của BatchNorm chưa kịp học gì
  - id: b
    text: BatchNorm chưa từng chạy ở train mode lúc train
  - id: c
    text: Weight decay kéo running_var về 1
  - id: d
    text: Ảnh đã chuẩn hoá theo kênh nên phương sai đúng bằng 1
- id: accum-bug
  kind: knowledge
  type: single
  prompt: Với lr = 0, gradient sau train_step(accum_steps=2) bằng đúng một nửa gradient tính trên nửa batch sau. Điều đó chỉ ra gì?
  options:
  - id: a
    text: Loss của mỗi nửa batch chưa được chia cho accum_steps
  - id: b
    text: Autograd tính sai gradient của conv
  - id: c
    text: Gradient của nửa batch đầu bị xoá trước step
  - id: d
    text: BatchNorm chuẩn hoá bằng thống kê của từng nửa batch
- id: gpu-reveals
  kind: knowledge
  type: single
  prompt: Chuyển notebook gốc sang GPU thì có một exception về device mà trên CPU không có. Vì sao CPU im lặng?
  options:
  - id: a
    text: Tensor PyTorch không quản lý vẫn ở CPU, như mọi thứ khác
  - id: b
    text: CPU tự ép mọi tensor về cùng một dtype nên không thấy lệch
  - id: c
    text: Trên CPU autograd tắt việc kiểm tra device để chạy nhanh hơn
  - id: d
    text: Exception trên CPU bị DataLoader nuốt mất
- id: hardest
  kind: data
  type: single
  prompt: Bug làm val acc giảm ít nhất khi chỉ còn một mình (0.596 xuống 0.526) qua được test 'học dữ liệu dễ'. Phép thử nào bắt nó?
  options:
  - id: a
    text: Vẽ lại vài ảnh sau bước tiền xử lý dữ liệu
  - id: b
    text: Đếm tham số của model, so với số tính tay
  - id: c
    text: Loss khi model đúng tuyệt đối
  - id: d
    text: So gradient với một backward trên cả batch
