- id: eval-symptom
  kind: knowledge
  type: single
  prompt: Toàn bộ vòng train chạy ở eval mode vì evaluate không trả về train(). BatchNorm làm gì trong lúc đó?
  options:
  - id: a
    text: Dùng running stats ban đầu, không cập nhật chúng
  - id: b
    text: Dùng thống kê batch như bình thường, chỉ dropout tắt
