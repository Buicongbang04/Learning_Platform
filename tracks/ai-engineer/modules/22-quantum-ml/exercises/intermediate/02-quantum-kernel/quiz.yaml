    text: Bài toán tối ưu của SVM hết lồi nên solver không còn hội tụ được
- id: centered
  kind: knowledge
  type: single
  prompt: Vì sao dùng alignment đã center thay vì ⟨K, T⟩ / (‖K‖‖T‖) thô?
