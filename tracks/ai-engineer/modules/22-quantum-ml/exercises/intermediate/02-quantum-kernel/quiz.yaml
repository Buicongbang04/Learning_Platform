    text: Center làm K thành nửa xác định dương, bản thô thì không
  - id: b
    text: Bản thô không tính được khi K có phần tử bằng đúng 0
  - id: c
    text: Bản đã center luôn bằng test accuracy của SVM tương ứng
  - id: d
    text: Bản thô đổi khi cộng hằng vào K và lệch theo tỉ lệ lớp
