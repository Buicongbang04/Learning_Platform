- id: concentration-why
  kind: knowledge
  type: single
  prompt: Khi kernel tiến về ma trận đơn vị, chuyện gì xảy ra với SVM?
  options:
  - id: a
    text: SVM gán mọi điểm vào lớp đông nhất vì kernel không phân biệt được
  - id: b
    text: Mọi điểm train thành support vector riêng, thuộc lòng, không tổng quát
