questions:
- id: logged-max
  kind: data
  type: single
  prompt: Chạy notebook gốc (đủ 5 bug), seed 0, return lớn nhất được log trong 150 000 bước là bao nhiêu?
  options:
  - id: a
    text: Đúng 500
  - id: b
    text: Khoảng 200
  - id: c
    text: Hàng nghìn trở lên
  - id: d
    text: Không quá 50
- id: entropy-bug
  kind: data
  type: single
  prompt: Chỉ còn bug dấu entropy (4 bug kia đã sửa), entropy ở lần cập nhật cuối so với bản đã sửa (khoảng 0.53) thế nào?
  options:
  - id: a
    text: Gần như bằng, chênh dưới 0.005
  - id: b
    text: Thấp hơn ở cả 3 seed
  - id: c
    text: Cao hơn, sát ln 2
  - id: d
    text: Sụp về đúng 0
- id: broadcast
  kind: knowledge
  type: single
  prompt: Trong PyTorch, `v` shape (128, 1) trừ `returns` shape (128,) cho kết quả shape nào?
  options:
  - id: a
    text: (128,)
  - id: b
    text: (128, 1)
  - id: c
    text: (128, 128)
  - id: d
    text: Báo lỗi shape
- id: truncation-late
  kind: knowledge
  type: single
  prompt: Vì sao bug coi truncated là kết thúc trong GAE gần như vô hại lúc đầu train CartPole?
  options:
  - id: a
    text: Lúc đầu hiếm episode nào sống tới 500 bước
  - id: b
    text: Lúc đầu critic chưa học nên V luôn bằng 0
  - id: c
    text: GAE chỉ dùng truncated khi λ bằng 1
  - id: d
    text: CartPole chỉ bật truncated sau 100 000 bước
- id: first-check
  kind: knowledge
  type: single
  prompt: Đường cong log return CartPole vượt 500. Bước đầu tiên nên làm gì?
  options:
  - id: a
    text: Giảm learning rate rồi train lại để xem
  - id: b
    text: Kiểm cách tính và reset return được log
  - id: c
    text: Tăng số seed lên 10 để giảm phương sai
  - id: d
    text: Đổi sang DQN vì PPO không ổn định
- id: max-vs-min
  kind: knowledge
  type: single
  prompt: Đổi min thành max trong clipped objective, với A > 0 và ρ = 1.5 (ε = 0.2) thì gradient theo ρ ra sao?
  options:
  - id: a
    text: Bằng 0, giống bản đúng
  - id: b
    text: Bằng A, không còn bị chặn
  - id: c
    text: Bằng 1.2 lần A
  - id: d
    text: Đổi dấu thành −A
