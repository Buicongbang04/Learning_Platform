questions:
- id: blue-mean
  kind: data
  type: single
  prompt: channel_stats trên 50 000 ảnh train CIFAR-10. Kênh nào có mean thấp nhất?
  options:
  - id: a
    text: R (đỏ)
  - id: b
    text: G (lục)
  - id: c
    text: B (lam)
  - id: d
    text: Ba kênh bằng nhau tới 3 chữ số
- id: vit-underfit
  kind: data
  type: single
  prompt: ViT có test acc thấp hơn ResNet-20. Nhìn train acc (10 000 ảnh train, không augment) của hai model, nguyên nhân chính là gì?
  options:
  - id: a
    text: ViT học thuộc tập train, train acc cao hơn ResNet-20
  - id: b
    text: ViT học chậm hơn, train acc cũng thấp hơn ResNet-20
  - id: c
    text: Hai model có train acc bằng nhau, chỉ khác ở test
  - id: d
    text: ViT không học được gì, train acc khoảng 10%
- id: no-aug-gap
  kind: data
  type: single
  prompt: So ResNet-20 có và không augmentation. Khoảng cách train acc (10 000 ảnh train, không augment) trừ test acc thay đổi thế nào khi bỏ augmentation?
  options:
  - id: a
    text: Gần như không đổi, hai khoảng cách bằng nhau
  - id: b
    text: Không đo được vì loss ra NaN
  - id: c
    text: Hẹp lại, test acc vượt cả train acc của model
  - id: d
    text: Rộng ra, train acc tăng nhiều hơn test acc
- id: speed
  kind: data
  type: single
  prompt: Thời gian mỗi epoch của ResNet-20 so với LeNet-5 trong bảng của bạn thế nào?
  options:
  - id: a
    text: Nhanh hơn, vì ít tầng Linear hơn
  - id: b
    text: Ngang nhau, cùng một vòng train
  - id: c
    text: Chậm hơn nhiều lần
  - id: d
    text: Chậm hơn đúng 4.4 lần, bằng tỉ lệ tham số
- id: sqrt-dk
  kind: knowledge
  type: single
  prompt: Vì sao attention chia QKᵀ cho căn bậc hai của d_h?
  options:
  - id: a
    text: Giữ phương sai tích vô hướng ổn định, softmax không bão hoà
  - id: b
    text: Để tổng mỗi dòng của ma trận attention bằng 1
  - id: c
    text: Để Q và K có cùng chuẩn với V
  - id: d
    text: Để giảm bộ nhớ của ma trận attention
- id: projection
  kind: knowledge
  type: single
  prompt: Trong ResNetCifar(20), bao nhiêu BasicBlock dùng shortcut projection (conv 1×1 + BN)?
  options:
  - id: a
    text: '0'
  - id: b
    text: '2'
  - id: c
    text: '3'
  - id: d
    text: '9'
- id: no-pos
  kind: knowledge
  type: single
  prompt: Bỏ position embedding khỏi ViT thì điều gì xảy ra?
  options:
  - id: a
    text: Model báo lỗi shape khi ghép CLS token
  - id: b
    text: Không ảnh hưởng vì patch embedding là conv đã biết vị trí
  - id: c
    text: Model không còn học được gì, accuracy về 10%
  - id: d
    text: Đảo thứ tự patch không đổi output, model thành túi patch
- id: gap
  kind: knowledge
  type: single
  prompt: Nhờ đâu ResNetCifar nhận được ảnh 48×40 mà không sửa code, còn LeNet5 thì không?
  options:
  - id: a
    text: BatchNorm chuẩn hoá theo kích thước ảnh
  - id: b
    text: Conv 3×3 có padding 1 giữ nguyên kích thước
  - id: c
    text: Global average pooling trước tầng Linear duy nhất
  - id: d
    text: Residual cộng input vào output
