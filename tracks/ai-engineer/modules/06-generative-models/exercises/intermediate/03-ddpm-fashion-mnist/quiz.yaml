questions:
- id: signal-t50
  kind: data
  type: single
  prompt: Ở bước t = 50 (cell forward process), sqrt(alpha_bar) của schedule linear và cosine lần lượt khoảng bao nhiêu?
  options:
  - id: a
    text: 0.985 và 0.996
  - id: b
    text: 0.996 và 0.985
  - id: c
    text: 0.72 và 0.92
  - id: d
    text: 0.50 và 0.50
- id: ddim-cost
  kind: data
  type: single
  prompt: Ở cấu hình GPU, DDIM 50 bước làm tỉ lệ "tự tin > 0.9" của giám khảo thay đổi bao nhiêu so với DDPM 1 000 bước?
  options:
  - id: a
    text: Tăng khoảng 0.3
  - id: b
    text: Thay đổi nhỏ, dưới 0.1
  - id: c
    text: Giảm về gần 0
  - id: d
    text: Giảm khoảng 0.3
- id: ema-diversity
  kind: data
  type: single
  prompt: Cấu hình GPU, DDPM 1 000 bước. So với trọng số thô, mẫu sinh bằng EMA khác rõ nhất ở chỉ số nào?
  options:
  - id: a
    text: Thời gian sinh nhanh gấp đôi
  - id: b
    text: KL tới đều thấp hơn hẳn
  - id: c
    text: Số lớp xuất hiện tăng từ 5 lên 10
  - id: d
    text: Không khác gì, EMA chỉ để lưu checkpoint
- id: linear-loss
  kind: data
  type: single
  prompt: Loss trung bình 100 bước cuối của model linear trong lần chạy của bạn nằm khoảng nào?
  options:
  - id: a
    text: Dưới 0.005, gần như bằng 0
  - id: b
    text: Từ khoảng 0.03 tới 0.07
  - id: c
    text: Từ 0.2 tới 0.3
  - id: d
    text: Khoảng 1.0, bằng phương sai nhiễu
- id: last-step
  kind: knowledge
  type: single
  prompt: Ở bước cuối (t = 0) của sampler DDPM, vì sao không cộng nhiễu?
  options:
  - id: a
    text: Vì cộng nhiễu ở bước cuối làm sampler chậm gấp đôi
  - id: b
    text: Variance posterior tại t = 0 bằng 0
  - id: c
    text: Vì generator đã hết số ngẫu nhiên sau T − 1 bước
  - id: d
    text: Vì model không được train ở t = 0
- id: clip-recompute
  kind: knowledge
  type: single
  prompt: Trong DDIM, sau khi kẹp x0 dự đoán vào [-1, 1], vì sao phải tính lại nhiễu dự đoán?
  options:
  - id: a
    text: Vì model phải chạy forward lần thứ hai cho chắc
  - id: b
    text: Để giảm phương sai của nhiễu ban đầu x_T
  - id: c
    text: Để x0 và nhiễu nhất quán với x_t
  - id: d
    text: Không cần, đó chỉ là tối ưu tốc độ
- id: ema-short
  kind: knowledge
  type: single
  prompt: Train chỉ 600 bước với EMA decay 0.999 thì mẫu sinh bằng EMA thường ra sao?
  options:
  - id: a
    text: Tốt hơn trọng số thô, vì EMA luôn tốt hơn
  - id: b
    text: Giống hệt trọng số thô vì decay quá nhỏ
  - id: c
    text: Lỗi, vì EMA cần ít nhất 1 000 bước
  - id: d
    text: Tệ hơn, EMA còn nặng trọng số khởi tạo
- id: diffusers-gap
  kind: data
  type: single
  prompt: 'Cell đối chiếu: max |alpha_bar của bạn − alphas_cumprod của diffusers| (schedule linear) cỡ bao nhiêu?'
  options:
  - id: a
    text: Đúng bằng 0
  - id: b
    text: Cỡ 1e-7, mức làm tròn float32
  - id: c
    text: Cỡ 1e-3
  - id: d
    text: Cỡ 0.1, vì hai bên khác schedule
