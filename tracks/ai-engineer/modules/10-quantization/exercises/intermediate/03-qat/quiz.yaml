questions:
- id: qat-recovery
  kind: data
  type: single
  prompt: Với int2 nhóm 32, QAT lấy lại khoảng bao nhiêu phần khoảng cách bpc giữa PTQ và model fine-tune float32 cùng ngân sách, tức (PTQ − QAT) / (PTQ − fine-tune float32)?
  options:
  - id: a
    text: Dưới 20%
  - id: b
    text: Khoảng 60% tới 95%
  - id: c
    text: Hơn 100%, QAT tốt hơn cả fine-tune float32
  - id: d
    text: Âm, QAT còn tệ hơn PTQ
- id: control
  kind: data
  type: single
  prompt: Đối chứng "fine-tune float32 cùng ngân sách rồi PTQ int2" cho bpc thế nào so với PTQ trên checkpoint gốc?
  options:
  - id: a
    text: Gần bằng hoặc tệ hơn PTQ trên checkpoint gốc
  - id: b
    text: Tốt ngang QAT
  - id: c
    text: Tốt hơn QAT khoảng 0.1 bpc ở cả hai cấu hình
  - id: d
    text: Tốt hơn float32 gốc
- id: loss-start
  kind: knowledge
  type: single
  prompt: Ở những bước đầu, vì sao loss train của model QAT int2 cao hơn loss của lần fine-tune float32 đối chứng?
  options:
  - id: a
    text: Forward dùng trọng số đã lượng tử, model chưa kịp thích nghi với lưới đó
  - id: b
    text: STE làm gradient sai dấu ở những bước đầu nên loss tăng lên
  - id: c
    text: Optimizer của QAT dùng learning rate lớn hơn bản đối chứng
  - id: d
    text: Dữ liệu train của QAT khác dữ liệu train của bản đối chứng
- id: ste-why
  kind: knowledge
  type: single
  prompt: Thiếu STE (để autograd tự lan truyền qua torch.round) thì QAT ra sao?
  options:
  - id: a
    text: Gradient theo trọng số bằng 0, trọng số không đổi
  - id: b
    text: Gradient bùng nổ vì round có đạo hàm vô hạn
  - id: c
    text: Vẫn train được, chỉ hội tụ chậm hơn một chút
  - id: d
    text: PyTorch báo lỗi vì round không khả vi
- id: master-weights
  kind: knowledge
  type: single
  prompt: Vì sao QAT giữ bản trọng số float32 "chủ" thay vì cập nhật thẳng mã lượng tử?
  options:
  - id: a
    text: Để file checkpoint cuối cùng nhỏ hơn
  - id: b
    text: Các bước cập nhật nhỏ hơn một bước lượng tử vẫn được cộng dồn
  - id: c
    text: Vì optimizer AdamW không cập nhật được tham số kiểu số nguyên
  - id: d
    text: Để lúc suy luận vẫn dùng được trọng số float32
- id: control-purpose
  kind: knowledge
  type: single
  prompt: Thí nghiệm đối chứng (fine-tune float32 rồi PTQ) trả lời câu hỏi nào?
  options:
  - id: a
    text: QAT có nhanh hơn fine-tune thường không
  - id: b
    text: Cải thiện đến từ việc thấy lượng tử hay chỉ từ việc train thêm
  - id: c
    text: Dữ liệu fine-tune có bị rò rỉ từ tập validation sang hay không
  - id: d
    text: Learning rate của QAT có quá lớn không
