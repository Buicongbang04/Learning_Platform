    text: Không sao, context chỉ giới hạn phần prompt
  - id: b
    text: Model tự nén prompt để có đủ chỗ trả lời
  - id: c
    text: API luôn từ chối mọi request trên 3 000 token
  - id: d
    text: Trả lời bị cắt hoặc prompt bị cắt bớt đầu
