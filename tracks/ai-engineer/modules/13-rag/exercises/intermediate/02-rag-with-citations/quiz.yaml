questions:
- id: gold-in-sources
  kind: data
  type: single
  prompt: Với retrieve hai tầng (5 điều dense, giữ 5 khoản), bao nhiêu trong 20 câu đầu tập ghim có điều đúng nằm trong nguồn?
  options:
  - id: a
    text: 20 / 20
  - id: b
    text: 18 / 20
  - id: c
    text: 15 / 20
  - id: d
    text: 11 / 20
- id: gate-ood
  kind: data
  type: single
  prompt: So điểm khoản cao nhất (cosine) của 5 câu ngoài phạm vi với 20 câu thật của tập ghim, kết quả thế nào?
  options:
  - id: a
    text: Hai nhóm chồng lên nhau, không ngưỡng nào tách được
  - id: b
    text: Mọi câu ngoài phạm vi thấp hơn mọi câu thật, cách khoảng 0.1
  - id: c
    text: Câu ngoài phạm vi cao hơn vì câu hỏi ngắn và chung chung
  - id: d
    text: Cả hai nhóm đều dưới 0.5, cổng chặn luôn cả câu thật
- id: theory-repro
  kind: knowledge
  type: single
  prompt: Ở thí nghiệm mục 5 (3 nguồn cả điều cắt ở 1 500 ký tự, có điều đúng), model 3B từ chối. Điều đó cho thấy gì?
  options:
  - id: a
    text: Nguồn không có căn cứ nào nên từ chối là hành vi đúng
  - id: b
    text: Model đã bịa câu trả lời rồi tự sửa thành câu từ chối
  - id: c
    text: Prompt chống bịa chặt khiến model nhỏ từ chối quá tay
  - id: d
    text: Retrieval sai vì điều đúng không có mặt trong prompt
- id: refuse-with-gold
  kind: data
  type: single
  prompt: Lý thuyết (cả điều cắt ở 1 500 ký tự) có 6 câu từ chối dù điều đúng nằm trong nguồn. Với nguồn là khoản, số câu như vậy thế nào?
  options:
  - id: a
    text: Về 0, model không còn từ chối câu nào
  - id: b
    text: Ít hơn hẳn, nhưng vẫn còn vài câu
  - id: c
    text: Vẫn khoảng 6, đơn vị nguồn không đổi gì
  - id: d
    text: Nhiều hơn, vì khoản ngắn thiếu ngữ cảnh
- id: gate-first
  kind: knowledge
  type: single
  prompt: Vì sao kiểm ngưỡng điểm retrieval trước khi gọi LLM, dù prompt đã dặn từ chối khi thiếu căn cứ?
  options:
  - id: a
    text: LLM không hiểu được chỉ thị từ chối bằng tiếng Việt
  - id: b
    text: Ollama báo lỗi nếu prompt chứa nguồn có điểm quá thấp
  - id: c
    text: Để điểm cosine của câu hỏi cao hơn khi gọi lại LLM
  - id: d
    text: Rẻ, và nội dung tài liệu trong prompt không lách được
- id: short-ids
  kind: knowledge
  type: single
  prompt: Vì sao bắt model trích `[2]` thay vì chép số hiệu "47/2011/TT-BCA"?
  options:
  - id: a
    text: Model nhỏ hay chép sai số hiệu; [2] thì code map ngược được
  - id: b
    text: Số ngắn tốn ít token hơn nên câu trả lời nhanh gấp đôi
  - id: c
    text: Số hiệu văn bản có dấu "/" làm hỏng định dạng JSON đầu ra
  - id: d
    text: Pháp luật cấm trích nguyên số hiệu văn bản trong câu trả lời
- id: drop-out-of-range
  kind: knowledge
  type: single
  prompt: Có 5 nguồn, model viết "Theo [1] và [7]". `parse_citations` nên làm gì với `[7]`?
  options:
  - id: a
    text: Bỏ đi, chỉ giữ [1], vì không có nguồn số 7
  - id: b
    text: Đổi thành [5], nguồn cuối cùng gần nhất với 7
  - id: c
    text: Báo lỗi và gọi lại LLM cho tới khi hết số sai
  - id: d
    text: Giữ lại, vì model có thể biết thêm nguồn khác
- id: cut-refusal
  kind: knowledge
  type: single
  prompt: Ở phần lý thuyết, model từ chối dù điều đúng nằm trong prompt. Nguyên nhân chính theo cây debug là gì?
  options:
  - id: a
    text: Nhiệt độ 0 làm model quá thận trọng khi trả lời
  - id: b
    text: Phần trả lời nằm sau chỗ cắt 1 500 ký tự của điều dài
  - id: c
    text: Retrieval đặt điều đúng ở hạng thấp nhất trong prompt
  - id: d
    text: bge-m3 cắt câu hỏi ở 4 096 token nên mất ý chính
