questions:
- id: seller-fe
  kind: knowledge
  type: single
  prompt: Seller fixed effects loại được loại confounder nào?
  options:
  - id: a
    text: Cú sốc chung của mọi seller trong cùng tháng
  - id: b
    text: Đặc tính của seller không đổi theo thời gian
  - id: c
    text: Thay đổi trong seller theo thời gian
  - id: d
    text: Quan hệ hai chiều giữa trễ và review
- id: time-fe
  kind: knowledge
  type: single
  prompt: Month fixed effects loại được gì?
  options:
  - id: a
    text: Cú sốc chung mọi seller trong cùng tháng (Black Friday, 02–03/2018)
  - id: b
    text: Đặc tính cố định của seller (kho, quy mô, danh mục bán chính, vùng)
  - id: c
    text: Sai số đo lường của `late_rate` ở tháng có ít đơn
  - id: d
    text: 'Selection: chỉ seller tồn tại đủ lâu mới vào mẫu phân tích'
- id: filter-order
  kind: knowledge
  type: single
  prompt: Vì sao lọc ô ít đơn (`min_orders`) **trước** rồi mới đếm số tháng (`min_months`)?
  options:
  - id: a
    text: Để chạy nhanh hơn
  - id: b
    text: Thứ tự không ảnh hưởng kết quả vì hai bộ lọc giao hoán
  - id: c
    text: Làm ngược lại giữ cả seller chỉ còn 1–2 ô đủ đơn
  - id: d
    text: Để giữ được nhiều seller nhỏ hơn trong mẫu phân tích
- id: not-causal
  kind: knowledge
  type: multi
  prompt: Những lý do nào khiến hệ số two-way FE chưa phải tác động nhân quả?
  options:
  - id: a
    text: Thay đổi trong seller theo thời gian (vd. đổi đối tác vận chuyển)
  - id: b
    text: 'Quan hệ hai chiều: hàng lỗi → đổi trả → giao lại trễ'
  - id: c
    text: Seller FE không loại được đặc tính cố định của seller
  - id: d
    text: 'Selection: chỉ giữ seller tồn tại đủ lâu'
- id: panel-size
