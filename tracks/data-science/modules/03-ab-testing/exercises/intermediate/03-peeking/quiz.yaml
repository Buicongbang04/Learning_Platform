questions:
- id: why-inflate
  kind: knowledge
  type: single
  prompt: Vì sao nhìn kết quả nhiều lần và dừng ở lần đầu p < 0.05 làm false positive tăng?
  options:
  - id: a
    text: Dữ liệu những ngày sau bị ghi lỗi nhiều hơn
  - id: b
    text: Dưới H0, z đi như random walk; vượt ±1.96 ở **ít nhất một** lần nhìn dễ hơn 5%
  - id: c
    text: p-value luôn giảm dần khi n tăng, nên sớm muộn cũng xuống dưới 0.05
  - id: d
    text: Power giảm khi nhìn nhiều lần, nên kết quả dương dễ là giả hơn
- id: vs-independent
  kind: knowledge
  type: single
  prompt: So với $$1 - 0.95^K$$, false positive thực tế khi nhìn K lần?
  options:
  - id: a
    text: Thấp hơn, vì các lần nhìn tương quan (dùng chung dữ liệu cũ)
  - id: b
    text: Bằng đúng, vì mỗi lần nhìn là một kiểm định 5%
  - id: c
    text: Cao hơn hẳn, vì các lần nhìn tương quan (dùng chung dữ liệu cũ)
  - id: d
    text: Luôn bằng đúng 5% nếu K và lịch nhìn được cố định từ trước khi chạy
- id: fpr-10
  kind: knowledge
  type: single
  prompt: A/A, nhìn 10 lần cách đều, dừng ở lần đầu p < 0.05. False positive khoảng?
  options:
  - id: a
    text: 5%
  - id: b
    text: 9–10%
  - id: c
    text: 40–41%
  - id: d
    text: ≈ 19%
- id: obf-first
  kind: knowledge
  type: single
  prompt: 'O''Brien-Fleming với K = 5, c = 2.04: biên $$c\sqrt{K/k}$$ ở lần nhìn đầu khoảng?'
  options:
  - id: a
    text: '1.96'
  - id: b
    text: '2.04'
  - id: c
    text: '4.56'
  - id: d
    text: '2.88'
- id: daily-ok
  kind: knowledge
  type: multi
  prompt: Việc nào làm hằng ngày mà **không** phá thí nghiệm?
  options:
  - id: a
    text: Theo dõi SRM
  - id: b
    text: Theo dõi guardrail an toàn
  - id: c
    text: Dừng khi metric chính có p < 0.05
  - id: d
    text: Đọc metric chính bằng always-valid inference (mSPRT, confidence sequence)
- id: obf-cost
  kind: knowledge
  type: single
  prompt: Cái giá của thiết kế O'Brien-Fleming với K = 5 so với nhìn một lần?
  options:
  - id: a
    text: False positive tăng lên khoảng 8% vì nhìn tới năm lần
  - id: b
    text: Biên cuối 2.04 > 1.96, nên cần thêm vài % mẫu
  - id: c
    text: Không bao giờ dừng sớm được vì biên lần đầu quá cao
  - id: d
    text: Phải gấp đôi cỡ mẫu để giữ được power như thiết kế một lần
