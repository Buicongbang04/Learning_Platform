questions:
- id: srm-action
  kind: knowledge
  type: single
  prompt: Phát hiện SRM. Nên làm gì?
  options:
  - id: a
    text: Lấy mẫu lại cho hai nhóm bằng nhau rồi phân tích
  - id: b
    text: Bỏ qua vì p-value của metric đã rất nhỏ
  - id: c
    text: Chuyển sang t-test
  - id: d
    text: Tìm nguyên nhân; chưa tin kết quả cho tới khi giải thích được
- id: resample
  kind: knowledge
  type: single
  prompt: 'Bootstrap CI cho chênh lệch hai nhóm: resample thế nào?'
  options:
  - id: a
    text: Riêng từng nhóm, giữ nguyên cỡ mỗi nhóm
  - id: b
    text: Gộp hai nhóm, resample rồi chia ngẫu nhiên lại
  - id: c
    text: Chỉ resample nhóm treatment
  - id: d
    text: Resample theo `sum_gamerounds`
- id: oec
  kind: knowledge
  type: single
  prompt: Chọn metric quyết định (OEC) cho thí nghiệm gate thế nào?
  options:
  - id: a
    text: Chọn metric có p-value nhỏ nhất sau khi xem kết quả
  - id: b
    text: '`retention_7`, định trước khi nhìn dữ liệu, vì gần giá trị dài hạn hơn'
  - id: c
    text: '`retention_1`, vì có nhiều người quay lại hơn'
  - id: d
    text: Trung bình `sum_gamerounds`
- id: not-measured
  kind: knowledge
  type: multi
  prompt: Thí nghiệm này **không** đo được điều gì?
  options:
  - id: a
    text: Doanh thu in-app
  - id: b
    text: Tỉ lệ quay lại sau 1 ngày
  - id: c
    text: Retention dài hạn (vài tuần, vài tháng sau khi cài)
  - id: d
    text: Tỉ lệ quay lại sau 7 ngày
- id: r7-diff
  kind: data
  type: single
  prompt: '`retention_7` của gate_40 trừ gate_30 là?'
