questions:
- id: metric
  kind: knowledge
  type: single
  prompt: Can thiệp có lợi (nhắn tin hỗ trợ khách có đơn trễ). Metric fairness chính nên là gì?
  options:
  - id: a
    text: Selection rate bằng nhau giữa các vùng (demographic parity)
  - id: b
    text: Recall bằng nhau giữa các vùng (equal opportunity)
  - id: c
    text: Precision bằng nhau giữa các vùng (predictive parity)
  - id: d
    text: Số cảnh báo bằng nhau giữa các vùng
- id: test-low
  kind: data
  type: single
  prompt: Trên tập test, vùng nào có tỉ lệ đơn trễ thấp nhất?
  options:
  - id: a
    text: N/NE
  - id: b
    text: SP
  - id: c
    text: khác
- id: impossible
  kind: knowledge
  type: single
  prompt: Vì sao không thể cân bằng mọi metric fairness cùng lúc?
  options:
  - id: a
    text: Tỉ lệ nền khác nhau thì calibration và cân bằng FPR/TPR loại trừ nhau
  - id: b
    text: Thư viện sklearn chưa hỗ trợ tối ưu đồng thời nhiều metric fairness khác nhau
  - id: c
    text: Số đơn của mỗi vùng khác nhau nên recall luôn khác nhau
  - id: d
    text: Model LightGBM không có tham số nào để ràng buộc fairness
- id: fpr-nne
  kind: data
  type: single
  prompt: 'Top 5% chung theo model lúc giao vận chuyển: FPR của N/NE là bao nhiêu?'
  options:
  - id: a
    text: 1.9%
  - id: b
    text: 15.2%
  - id: c
    text: 20.6%
  - id: d
    text: 31.7%
- id: drop-state
  kind: knowledge
  type: single
  prompt: Bỏ cột `customer_state` khỏi model có làm hệ thống công bằng hơn không?
  options:
  - id: a
    text: Có, model không còn biết vùng nên mọi vùng được đối xử như nhau
  - id: b
    text: Có, nhưng chỉ khi train lại với `class_weight="balanced"`
  - id: c
    text: Không chắc, các feature khác vẫn mang thông tin địa lý
  - id: d
    text: Không, vì bỏ cột làm model thiên vị São Paulo nhiều hơn
- id: purchase-share
  kind: data
  type: single
  prompt: 'Model lúc đặt hàng, top 5%: bao nhiêu phần trăm cảnh báo rơi vào N/NE?'
  options:
  - id: a
    text: 18.9%
  - id: b
    text: 35.0%
  - id: c
    text: 50.0%
  - id: d
    text: 24.3%
- id: idxmin
  kind: knowledge
  type: single
  prompt: Dùng `idxmin` cho FPR rồi gọi nhóm có FPR thấp nhất là "tệ nhất". Sai ở đâu?
  options:
  - id: a
    text: FPR không xác định khi một nhóm không có đơn đúng hẹn nào
  - id: b
    text: Phải dùng ratio min/max chứ không dùng idxmin
  - id: c
    text: FPR càng thấp càng tốt, nhóm tệ nhất là nhóm FPR cao nhất
  - id: d
    text: Nhóm tệ nhất luôn là nhóm có ít đơn nhất
- id: need-recall
  kind: data
  type: single
  prompt: 'Chia ngân sách theo nhu cầu (`allocate_by_need`): recall của N/NE thành bao nhiêu?'
  options:
  - id: a
    text: 17.9%
  - id: b
    text: 20.8%
  - id: c
    text: 31.7%
  - id: d
    text: 44.2%
