questions:
- id: order-denom
  kind: knowledge
  type: single
  prompt: Kiểm tra thứ tự thời gian (vd. carrier sau customer) lấy mẫu số là?
  options:
  - id: a
    text: Mọi đơn
  - id: b
    text: Đơn có cả hai ngày
  - id: c
    text: Đơn `delivered`
  - id: d
    text: Đơn có review trả lời
- id: severity
  kind: knowledge
  type: single
  prompt: Severity của một kiểm tra nên dựa vào?
  options:
  - id: a
    text: Số dòng lỗi tuyệt đối trong bảng
  - id: b
    text: Tỉ lệ lỗi so với tổng số dòng của bảng
  - id: c
    text: Tác động lên phân tích phía sau
  - id: d
    text: Bảng chứa lỗi
- id: payment-join
  kind: knowledge
  type: single
  prompt: 'So tổng `payment_value` với tổng `price + freight_value`: làm sao để không nhân dòng?'
