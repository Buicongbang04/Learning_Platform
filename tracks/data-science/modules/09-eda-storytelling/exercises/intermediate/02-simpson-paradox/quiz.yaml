questions:
- id: weak
  kind: knowledge
  type: single
  prompt: Đảo chiều dạng "yếu" trong bài nghĩa là?
  options:
  - id: a
    text: Mọi tầng đều ngược chiều crude
  - id: b
    text: Crude và adjusted ngược dấu
  - id: c
    text: Adjusted bằng 0
  - id: d
    text: Có ít nhất một tầng ngược chiều crude
- id: mediator
  kind: knowledge
  type: single
  prompt: Câu hỏi là tác động của logistics lên review. Phân tầng theo số ngày giao có vấn đề gì?
  options:
  - id: a
    text: 'Số ngày giao là mediator: phân tầng chặn chính con đường cần đo'
  - id: b
    text: Không có vấn đề gì
  - id: c
    text: Số ngày giao là confounder, nên bắt buộc phải phân tầng theo nó
  - id: d
    text: Có quá nhiều tầng
- id: bool-loc
  kind: knowledge
  type: single
  prompt: 'Tầng kiểu bool (`late`): vì sao dùng `reindex` thay `.loc[strata]`?'
  options:
  - id: a
    text: '`reindex` nhanh hơn `.loc` nhiều lần trên bảng lớn có nhiều tầng'
  - id: b
    text: '`.loc` không nhận list'
  - id: c
    text: '`.loc[[False, True]]` thành mask, chọn sai dòng mà không báo lỗi'
  - id: d
    text: '`reindex` tự chuẩn hoá lại trọng số khi một tầng bị thiếu'
