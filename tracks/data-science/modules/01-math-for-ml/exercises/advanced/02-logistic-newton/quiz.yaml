questions:
- id: convex-why
  kind: knowledge
  type: single
  prompt: Vì sao loss logistic (chưa có L2) là hàm lồi?
  options:
  - id: a
    text: Vì sigmoid là hàm lồi
  - id: b
    text: Vì loss luôn dương
  - id: c
    text: Vì Hessian $$\frac1n X^\top \mathrm{diag}(p(1-p))X$$ nửa xác định dương, do $$p(1-p) > 0$$
  - id: d
    text: Vì gradient bằng 0 tại $$w = 0$$
- id: scale-feature
  kind: knowledge
  type: single
  prompt: Nhân một feature với 10 (không chuẩn hoá lại). Số bước tới optimum thay đổi thế nào?
  options:
  - id: a
    text: Gradient descent chậm đi nhiều, Newton gần như không đổi
  - id: b
    text: Cả hai chậm đi khoảng 10 lần
  - id: c
    text: Newton chậm đi, gradient descent không đổi
  - id: d
    text: Cả hai không đổi vì optimum là một
- id: separable
  kind: knowledge
  type: multi
  prompt: Dữ liệu tách được hoàn toàn (một feature chia đúng y = 0 / y = 1). Những phát biểu nào đúng?
  options:
  - id: a
    text: 'MLE không có nghiệm hữu hạn: loss giảm mãi khi $$\lVert w\rVert \to \infty$$'
  - id: b
    text: Newton hội tụ trong vài bước tới một nghiệm hữu hạn duy nhất
  - id: c
    text: Hessian tiến gần suy biến vì $$p(1-p) \to 0$$
  - id: d
    text: Thêm L2 làm loss strongly convex, có nghiệm hữu hạn duy nhất
- id: sklearn-c
  kind: knowledge
  type: single
  prompt: '`LogisticRegression(C=C)` tương đương cực tiểu loss **trung bình** cộng $$\frac{\lambda}{2}\lVert w\rVert^2$$ với $$\lambda$$ bằng?'
  options:
  - id: a
    text: $$C$$
  - id: b
    text: $$1/C$$
  - id: c
    text: $$Cn$$
  - id: d
    text: $$1/(Cn)$$
