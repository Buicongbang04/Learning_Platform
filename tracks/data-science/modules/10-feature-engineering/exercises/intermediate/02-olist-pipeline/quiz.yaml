questions:
- id: delay-ok
  kind: knowledge
  type: single
  prompt: 'Bài này dự đoán review xấu ngay khi đơn vừa giao xong. Với bài toán đó, `delay_days` (giao thực tế − ngày hẹn) có phải leakage không?'
  options:
  - id: a
    text: Có, vì dùng ngày giao thực tế, thứ không biết được lúc khách đặt hàng
  - id: b
    text: Có, vì tương quan mạnh với nhãn nên chắc chắn chứa thông tin từ review
  - id: c
    text: Không, vì ta dự đoán lúc đơn vừa giao; lúc mua thì mới là leakage
  - id: d
    text: Không bao giờ là leakage
- id: passthrough
  kind: knowledge
  type: single
  prompt: Vì sao không dùng `remainder="passthrough"` trong `ColumnTransformer`?
  options:
  - id: a
    text: Nó đưa mọi cột còn lại, kể cả `review_score`, vào model
  - id: b
    text: Nó làm chậm pipeline
  - id: c
    text: Nó không chạy được khi trong pipeline có `TargetEncoder`
  - id: d
    text: Nó bỏ các cột số
- id: optimistic
  kind: knowledge
  type: multi
  prompt: Cách làm nào khiến điểm đánh giá lạc quan giả?
  options:
  - id: a
    text: '`StandardScaler().fit(table)` rồi mới chia train/val'
  - id: b
    text: Fit `TargetEncoder` trên toàn bộ bảng
  - id: c
    text: Fit cả pipeline chỉ trên train
  - id: d
    text: Chọn `C` bằng tập test
- id: pure-id
  kind: knowledge
  type: single
  prompt: Vì sao không dùng `order_id` làm feature?
  options:
  - id: a
    text: Là chuỗi
  - id: b
    text: Mỗi giá trị xuất hiện một lần, không tổng quát hoá được
  - id: c
    text: Có null
  - id: d
    text: Là leakage, vì `order_id` được tạo cùng lúc với review
