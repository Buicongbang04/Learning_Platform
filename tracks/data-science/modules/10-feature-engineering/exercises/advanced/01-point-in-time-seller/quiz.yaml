    text: 2.0%
  - id: b
    text: 3.2%
  - id: c
    text: 4.7%
  - id: d
    text: 0%
- id: best-test
  kind: data
  type: single
  prompt: Trong bốn biến thể, biến thể nào có AUC test cao nhất?
  options:
