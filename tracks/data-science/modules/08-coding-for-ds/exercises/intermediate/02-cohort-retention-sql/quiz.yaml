questions:
- id: unique-id
  kind: knowledge
  type: single
  prompt: Vì sao gộp khách theo `customer_unique_id`, không theo `customer_id`?
  options:
  - id: a
    text: '`customer_id` có nhiều giá trị null'
  - id: b
    text: Mỗi đơn có `customer_id` mới, nên mọi khách trông như mua một lần
  - id: c
    text: '`customer_unique_id` là khoá của bảng orders'
  - id: d
    text: Để query chạy nhanh hơn
- id: censored
  kind: knowledge
  type: single
  prompt: Ô `(cohort, k)` với cohort + k sau `last_month` nên mang giá trị gì?
  options:
