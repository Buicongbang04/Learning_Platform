questions:
- id: no-mc-noise
  kind: knowledge
  type: single
  prompt: Loại CI nào cho median **không** có nhiễu Monte Carlo (đổi seed không đổi kết quả)?
  options:
  - id: a
    text: Bootstrap percentile
  - id: b
    text: CI chính xác từ thống kê thứ tự
  - id: c
    text: Cả hai
  - id: d
    text: Không loại nào
- id: exact-basis
  kind: knowledge
  type: single
  prompt: CI chính xác cho median dựa trên điều gì?
  options:
  - id: a
    text: CLT áp cho median
  - id: b
    text: Phân phối t với n − 1 bậc tự do
  - id: c
    text: Số quan sát dưới median thật có phân phối $$\mathrm{Binomial}(n, 0.5)$$
  - id: d
    text: Số quan sát dưới median thật có phân phối Poisson
- id: clustered
  kind: knowledge
  type: single
  prompt: Nhiều đơn đến từ cùng một khách. Resample từng đơn độc lập thì CI bootstrap?
  options:
  - id: a
    text: Quá hẹp; nên resample theo khách (cluster) hoặc block bootstrap
  - id: b
    text: Quá rộng; nên resample từng đơn nhiều lần hơn
  - id: c
    text: Không bị ảnh hưởng
  - id: d
    text: Lệch tâm nhưng độ rộng đúng
- id: boot-fails
  kind: knowledge
  type: multi
  prompt: Trường hợp nào CI bootstrap percentile **không** đáng tin?
  options:
  - id: a
    text: Thống kê cực trị như max, min
  - id: b
    text: Median của 40 000 đơn độc lập
  - id: c
    text: Percentile 99 trên 200 quan sát
  - id: d
    text: Mẫu bị lệch chọn (sampling bias)
