questions:
- id: naive-loses
  kind: knowledge
  type: single
  prompt: Vì sao baseline "cùng thứ tuần trước" thua xa?
  options:
  - id: a
    text: Rossmann không có mùa vụ tuần, nên tuần trước không mang thông tin gì
  - id: b
    text: Tuần trước thường có trạng thái khuyến mãi ngược với tuần dự báo
  - id: c
    text: Baseline không xử lý ngày đóng cửa nên dự báo doanh thu cho cả Chủ nhật
  - id: d
    text: RMSPE phạt dự báo thấp nặng hơn
