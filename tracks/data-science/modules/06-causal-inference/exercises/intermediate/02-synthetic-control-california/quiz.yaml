questions:
- id: weights
  kind: knowledge
  type: single
  prompt: Trọng số synthetic control bị ràng buộc thế nào?
  options:
  - id: a
    text: Tuỳ ý, ước lượng bằng OLS
  - id: b
    text: Không âm và tổng bằng 1
  - id: c
    text: Tổng bằng 1, được phép âm
  - id: d
    text: Bằng nhau cho mọi donor
- id: min-p
  kind: knowledge
  type: single
  prompt: 'Placebo trên 39 bang: p-value hoán vị nhỏ nhất có thể là?'
  options:
  - id: a
    text: '0.05'
  - id: b
    text: '0.01'
  - id: c
    text: $$1/39 \approx 0.026$$
  - id: d
    text: '0'
- id: ratio
  kind: knowledge
  type: single
  prompt: Vì sao xếp placebo theo tỉ số RMSPE sau / trước thay vì chỉ theo gap sau can thiệp?
  options:
  - id: a
    text: Tỉ số luôn dương nên dễ vẽ
  - id: b
    text: RMSPE sau không tính được cho bang placebo
  - id: c
    text: Để p-value nhỏ hơn
  - id: d
    text: Gap lớn sau can thiệp chỉ đáng tin khi khớp tốt trước can thiệp; tỉ số gói cả hai ý
- id: not-use
  kind: knowledge
  type: multi
  prompt: Khi nào **không** nên dùng synthetic control?
  options:
  - id: a
    text: Chuỗi trước can thiệp ngắn
  - id: b
    text: Đơn vị treated nằm ngoài bao lồi của donor
  - id: c
    text: Can thiệp cấp bang, nhiều bang donor, chuỗi trước dài
  - id: d
    text: Donor cũng chịu ảnh hưởng của can thiệp (spillover)
