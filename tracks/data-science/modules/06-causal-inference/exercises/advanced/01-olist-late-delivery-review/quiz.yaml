questions:
- id: no-adjust
  kind: knowledge
  type: multi
  prompt: Biến nào **không** được đưa vào tập điều chỉnh khi ước lượng tác động của giao trễ?
  options:
  - id: a
    text: Thời gian giao thực tế
  - id: b
    text: Bang của khách
  - id: c
    text: Khách có liên hệ CSKH
  - id: d
    text: Số ngày hứa giao
- id: selection
  kind: knowledge
  type: single
  prompt: Bảng chỉ gồm đơn **có review**. Đó là vấn đề gì?
  options:
  - id: a
    text: Confounder chưa đo
  - id: b
    text: Mediator
  - id: c
    text: 'Điều kiện trên collider: việc có review phụ thuộc cả giao trễ lẫn trải nghiệm'
