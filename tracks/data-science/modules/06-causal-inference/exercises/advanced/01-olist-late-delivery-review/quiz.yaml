    text: Odds review xấu của đơn trễ gấp 0.444 lần
  - id: b
    text: 44.4% đơn trễ có review xấu
  - id: c
    text: Review xấu làm khả năng trễ tăng 44.4%
  - id: d
    text: Giữ nguyên covariate, xác suất review xấu của đơn trễ cao hơn 44.4 điểm phần trăm
