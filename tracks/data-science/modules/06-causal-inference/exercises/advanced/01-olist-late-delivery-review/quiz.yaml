questions:
- id: no-adjust
  kind: knowledge
  type: multi
  prompt: Biến nào **không** được đưa vào tập điều chỉnh khi ước lượng tác động của giao trễ?
  options:
  - id: a
    text: Thời gian giao thực tế
  - id: b
    text: Bang của khách
  - id: c
    text: Khách có liên hệ CSKH
  - id: d
    text: Số ngày hứa giao
- id: selection
  kind: knowledge
  type: single
  prompt: Bảng chỉ gồm đơn **có review**. Đó là vấn đề gì?
  options:
  - id: a
    text: 'Confounder chưa đo: vùng xa vừa gây trễ vừa ít review'
  - id: b
    text: 'Mediator: review là bước nằm giữa giao trễ và điểm số'
  - id: c
    text: 'Collider: việc có review phụ thuộc cả giao trễ lẫn trải nghiệm'
  - id: d
    text: Không có vấn đề, vì đơn không review vốn không có nhãn để học
- id: e-value
  kind: knowledge
  type: single
  prompt: E-value khoảng 11 nghĩa là?
  options:
  - id: a
    text: Tác động thật gấp 11 lần tác động quan sát được sau khi đã điều chỉnh mọi confounder
  - id: b
    text: Confounder chưa đo phải gắn với cả trễ lẫn review xấu cỡ RR 11 mới xoá được tác động
  - id: c
    text: Cần ít nhất 11 confounder chưa đo, mỗi biến đủ mạnh, mới giải thích hết kết quả quan sát
  - id: d
    text: p-value nhỏ hơn 1/11 nên kết quả có ý nghĩa
- id: lpm
  kind: knowledge
  type: single
  prompt: Trong `bad_review ~ late + covariate` (linear probability model), hệ số của `late` là 0.444. Nghĩa là?
  options:
  - id: a
    text: Giữ nguyên covariate, odds review xấu của đơn trễ gấp 0.444 lần đơn đúng hẹn
  - id: b
    text: 44.4% đơn trễ có review xấu, sau khi đã điều chỉnh covariate
  - id: c
    text: Review xấu làm khả năng giao trễ tăng 44.4% khi giữ nguyên mọi covariate khác
  - id: d
    text: Giữ nguyên covariate, xác suất review xấu của đơn trễ cao hơn 44.4 điểm %
- id: late-7d
  kind: data
  type: single
  prompt: Trong các đơn trễ, bao nhiêu phần trăm trễ **từ 7 ngày trở lên** (`days_late >= 7`)?
