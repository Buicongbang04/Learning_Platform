services:
  api:
    build:
      context: ..
      dockerfile: container/Dockerfile
      target: api
    image: olist-shop/api:latest
    environment:
      DATABASE_URL: postgresql+psycopg://olist:olist@postgres:5432/olist
      REDIS_URL: redis://redis:6379/0
      APP_VERSION: dev
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    image: olist-shop/worker:latest
    command: ["python", "-m", "olist_shop.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://olist:olist@postgres:5432/olist
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      POSTGRES_DB: olist
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
