limit_req_zone $binary_remote_addr zone=olist_all:1m rate=5r/s;

upstream olist_api {
    server api:8000;
}

server {
    listen 80;
    server_name olist-shop.local;

    location / {
        proxy_pass http://olist_api;
    }
}

server {
    listen 443 ssl;
    server_name olist-shop.local;
    ssl_certificate /etc/nginx/tls/olist-shop.crt;
    ssl_certificate_key /etc/nginx/tls/olist-shop.key;

    limit_req zone=olist_all;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://olist_api;
    }
}
