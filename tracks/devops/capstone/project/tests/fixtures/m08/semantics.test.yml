rule_files:
  - rules/olist.yml

evaluation_interval: 5s

tests:
  - name: RED API chỉ tính job olist-api, lỗi là 5xx
    interval: 20s
    input_series:
      - series: 'http_requests_total{job="olist-api", instance="api:8000", method="GET", path="/orders/{order_id}", status="200"}'
        values: '0+160x80'
      - series: 'http_requests_total{job="olist-api", instance="api:8000", method="GET", path="/orders/{order_id}", status="404"}'
        values: '0+20x80'
      - series: 'http_requests_total{job="olist-api", instance="api:8000", method="GET", path="/readyz", status="503"}'
        values: '0+20x80'
      - series: 'http_requests_total{job="olist-api-canary", instance="canary:8000", method="GET", path="/readyz", status="503"}'
        values: '0+400x80'
      - series: 'http_request_duration_seconds_bucket{job="olist-api", instance="api:8000", method="GET", path="/orders/{order_id}", le="0.25"}'
        values: '0x80'
      - series: 'http_request_duration_seconds_bucket{job="olist-api", instance="api:8000", method="GET", path="/orders/{order_id}", le="0.5"}'
        values: '0+200x80'
      - series: 'http_request_duration_seconds_bucket{job="olist-api", instance="api:8000", method="GET", path="/orders/{order_id}", le="+Inf"}'
        values: '0+200x80'
      - series: 'http_request_duration_seconds_bucket{job="olist-api-canary", instance="canary:8000", method="GET", path="/orders/{order_id}", le="0.5"}'
        values: '0x80'
      - series: 'http_request_duration_seconds_bucket{job="olist-api-canary", instance="canary:8000", method="GET", path="/orders/{order_id}", le="+Inf"}'
        values: '0+800x80'
    promql_expr_test:
      - expr: olist:api_requests:rate1m
        eval_time: 10m
        exp_samples:
          - labels: olist:api_requests:rate1m
            value: 10
      - expr: olist:api_errors:ratio_rate1m
        eval_time: 10m
        exp_samples:
          - labels: olist:api_errors:ratio_rate1m
            value: 0.1
      - expr: olist:api_latency_seconds:p95_1m
        eval_time: 10m
        exp_samples:
          - labels: olist:api_latency_seconds:p95_1m
            value: 0.4875
    alert_rule_test:
      - alertname: OlistApiHighErrorRate
        eval_time: 4m
        exp_alerts: []
      - alertname: OlistApiHighErrorRate
        eval_time: 7m
        exp_alerts:
          - exp_labels:
              severity: page
              service: api
      - alertname: OlistApiSlow
        eval_time: 15m
        exp_alerts: []

  - name: Lỗi 4% không page
    interval: 20s
    input_series:
      - series: 'http_requests_total{job="olist-api", instance="api:8000", method="GET", path="/orders/{order_id}", status="200"}'
        values: '0+192x80'
      - series: 'http_requests_total{job="olist-api", instance="api:8000", method="GET", path="/readyz", status="503"}'
        values: '0+8x80'
    alert_rule_test:
      - alertname: OlistApiHighErrorRate
        eval_time: 15m
        exp_alerts: []

  - name: Chưa có 5xx nào thì tỉ lệ lỗi là 0, không mất series
    interval: 20s
    input_series:
      - series: 'http_requests_total{job="olist-api", instance="api:8000", method="GET", path="/healthz", status="200"}'
        values: '0+40x80'
    promql_expr_test:
      - expr: olist:api_errors:ratio_rate1m
        eval_time: 10m
        exp_samples:
          - labels: olist:api_errors:ratio_rate1m
            value: 0

  - name: API chậm 10 phút thì ticket
    interval: 20s
    input_series:
      - series: 'http_requests_total{job="olist-api", instance="api:8000", method="GET", path="/stats/revenue-by-state", status="200"}'
        values: '0+20x80'
      - series: 'http_request_duration_seconds_bucket{job="olist-api", instance="api:8000", method="GET", path="/stats/revenue-by-state", le="0.5"}'
        values: '0x80'
      - series: 'http_request_duration_seconds_bucket{job="olist-api", instance="api:8000", method="GET", path="/stats/revenue-by-state", le="1"}'
        values: '0+20x80'
      - series: 'http_request_duration_seconds_bucket{job="olist-api", instance="api:8000", method="GET", path="/stats/revenue-by-state", le="+Inf"}'
        values: '0+20x80'
    alert_rule_test:
      - alertname: OlistApiSlow
        eval_time: 9m
        exp_alerts: []
      - alertname: OlistApiSlow
        eval_time: 12m
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: api
      - alertname: OlistApiHighErrorRate
        eval_time: 12m
        exp_alerts: []

  - name: RED worker lấy duration từ span process olist:jobs của spanmetrics
    interval: 20s
    input_series:
      - series: 'jobs_processed_total{job="olist-worker", instance="worker:9101"}'
        values: '0+36x80'
      - series: 'jobs_failed_total{job="olist-worker", instance="worker:9101"}'
        values: '0+4x80'
      - series: 'jobs_processed_total{job="olist-worker-canary", instance="canary:9101"}'
        values: '0+400x80'
      - series: 'traces_span_metrics_duration_milliseconds_bucket{job="otel-spanmetrics", service_name="olist-shop-worker", span_name="process olist:jobs", span_kind="SPAN_KIND_CONSUMER", status_code="STATUS_CODE_UNSET", le="50"}'
        values: '0x80'
      - series: 'traces_span_metrics_duration_milliseconds_bucket{job="otel-spanmetrics", service_name="olist-shop-worker", span_name="process olist:jobs", span_kind="SPAN_KIND_CONSUMER", status_code="STATUS_CODE_UNSET", le="100"}'
        values: '0+40x80'
      - series: 'traces_span_metrics_duration_milliseconds_bucket{job="otel-spanmetrics", service_name="olist-shop-worker", span_name="process olist:jobs", span_kind="SPAN_KIND_CONSUMER", status_code="STATUS_CODE_UNSET", le="+Inf"}'
        values: '0+40x80'
      - series: 'traces_span_metrics_duration_milliseconds_bucket{job="otel-spanmetrics", service_name="olist-shop-worker", span_name="DELETE olist", span_kind="SPAN_KIND_CLIENT", status_code="STATUS_CODE_UNSET", le="1000"}'
        values: '0x80'
      - series: 'traces_span_metrics_duration_milliseconds_bucket{job="otel-spanmetrics", service_name="olist-shop-worker", span_name="DELETE olist", span_kind="SPAN_KIND_CLIENT", status_code="STATUS_CODE_UNSET", le="+Inf"}'
        values: '0+400x80'
      - series: 'traces_span_metrics_duration_milliseconds_bucket{job="otel-spanmetrics", service_name="olist-shop-api", span_name="process olist:jobs", span_kind="SPAN_KIND_CONSUMER", status_code="STATUS_CODE_UNSET", le="1000"}'
        values: '0x80'
      - series: 'traces_span_metrics_duration_milliseconds_bucket{job="otel-spanmetrics", service_name="olist-shop-api", span_name="process olist:jobs", span_kind="SPAN_KIND_CONSUMER", status_code="STATUS_CODE_UNSET", le="+Inf"}'
        values: '0+400x80'
    promql_expr_test:
      - expr: olist:worker_jobs:rate1m
        eval_time: 10m
        exp_samples:
          - labels: olist:worker_jobs:rate1m
            value: 2
      - expr: olist:worker_errors:ratio_rate1m
        eval_time: 10m
        exp_samples:
          - labels: olist:worker_errors:ratio_rate1m
            value: 0.1
      - expr: olist:worker_duration_seconds:p95_1m
        eval_time: 10m
        exp_samples:
          - labels: olist:worker_duration_seconds:p95_1m
            value: 0.0975

  - name: Worker không scrape được thì page, không page ngay lần lỡ đầu
    interval: 5s
    input_series:
      - series: 'up{job="olist-worker", instance="worker:9101"}'
        values: '1x24 0x40'
      - series: 'up{job="olist-api", instance="api:8000"}'
        values: '0x64'
    alert_rule_test:
      - alertname: OlistWorkerDown
        eval_time: 1m55s
        exp_alerts: []
      - alertname: OlistWorkerDown
        eval_time: 2m5s
        exp_alerts: []
      - alertname: OlistWorkerDown
        eval_time: 3m15s
        exp_alerts:
          - exp_labels:
              severity: page
              service: worker
