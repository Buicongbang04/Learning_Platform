limit_req_zone $binary_remote_addr zone=olist_jobs:10m rate=5r/s;

map $http_x_request_id $olist_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format olist_edge '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      'rid=$olist_request_id rt=$request_time urt=$upstream_response_time '
                      'ua="$http_user_agent"';

upstream olist_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name olist-shop.local localhost;
    access_log /var/log/nginx/access.log olist_edge;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name olist-shop.local localhost;
    server_tokens off;
    access_log /var/log/nginx/access.log olist_edge;

    ssl_certificate /etc/nginx/tls/olist-shop.crt;
    ssl_certificate_key /etc/nginx/tls/olist-shop.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:olist_tls:10m;
    ssl_session_timeout 1h;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $olist_request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    location /jobs/ {
        limit_req zone=olist_jobs burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://olist_api;
    }

    location / {
        proxy_pass http://olist_api;
    }
}
