rule_files:
  - rules/olist.yml

evaluation_interval: 15s

tests:
  - name: RED của API khi 20% request lỗi 5xx
    interval: 20s
    input_series:
      - series: 'http_requests_total{job="olist-api", instance="api:8000", method="GET", path="/orders/{order_id}", status="200"}'
        values: '0+80x80'
      - series: 'http_requests_total{job="olist-api", instance="api:8000", method="GET", path="/readyz", status="503"}'
        values: '0+20x80'
      - series: 'http_request_duration_seconds_bucket{job="olist-api", instance="api:8000", method="GET", path="/orders/{order_id}", le="0.1"}'
        values: '0+100x80'
      - series: 'http_request_duration_seconds_bucket{job="olist-api", instance="api:8000", method="GET", path="/orders/{order_id}", le="+Inf"}'
        values: '0+100x80'
    promql_expr_test:
      - expr: olist:api_requests:rate1m
        eval_time: 5m
        exp_samples:
          - labels: olist:api_requests:rate1m
            value: 5
      - expr: olist:api_errors:ratio_rate1m
        eval_time: 5m
        exp_samples:
          - labels: olist:api_errors:ratio_rate1m
            value: 0.2
      - expr: olist:api_latency_seconds:p95_1m
        eval_time: 5m
        exp_samples:
          - labels: olist:api_latency_seconds:p95_1m
            value: 0.095
    alert_rule_test:
      - alertname: OlistApiHighErrorRate
        eval_time: 4m
        exp_alerts: []
      - alertname: OlistApiHighErrorRate
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              severity: page
              service: api
            exp_annotations:
              summary: "API Olist Shop trả 5xx cho 20% request trong 5 phút"
              runbook_url: https://example.invalid/runbooks/olist-api-errors
      - alertname: OlistApiSlow
        eval_time: 15m
        exp_alerts: []

  - name: API chậm, ít lỗi
    interval: 20s
    input_series:
      - series: 'http_requests_total{job="olist-api", instance="api:8000", method="GET", path="/stats/revenue-by-state", status="200"}'
        values: '0+200x80'
      - series: 'http_requests_total{job="olist-api", instance="api:8000", method="GET", path="/stats/revenue-by-state", status="500"}'
        values: '0+4x80'
      - series: 'http_request_duration_seconds_bucket{job="olist-api", instance="api:8000", method="GET", path="/stats/revenue-by-state", le="0.5"}'
        values: '0x80'
      - series: 'http_request_duration_seconds_bucket{job="olist-api", instance="api:8000", method="GET", path="/stats/revenue-by-state", le="2.5"}'
        values: '0+204x80'
      - series: 'http_request_duration_seconds_bucket{job="olist-api", instance="api:8000", method="GET", path="/stats/revenue-by-state", le="+Inf"}'
        values: '0+204x80'
    alert_rule_test:
      - alertname: OlistApiHighErrorRate
        eval_time: 15m
        exp_alerts: []
      - alertname: OlistApiSlow
        eval_time: 9m
        exp_alerts: []
      - alertname: OlistApiSlow
        eval_time: 12m
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: api
            exp_annotations:
              summary: "p95 latency của API là 2.4s, quá 500 ms trong 10 phút"
              runbook_url: https://example.invalid/runbooks/olist-api-latency

  - name: RED của worker
    interval: 20s
    input_series:
      - series: 'jobs_processed_total{job="olist-worker", instance="worker:9101"}'
        values: '0+16x80'
      - series: 'jobs_failed_total{job="olist-worker", instance="worker:9101"}'
        values: '0+4x80'
      - series: 'traces_span_metrics_duration_milliseconds_bucket{job="otel-spanmetrics", service_name="olist-shop-worker", span_name="process olist:jobs", le="250"}'
        values: '0x80'
      - series: 'traces_span_metrics_duration_milliseconds_bucket{job="otel-spanmetrics", service_name="olist-shop-worker", span_name="process olist:jobs", le="500"}'
        values: '0+20x80'
      - series: 'traces_span_metrics_duration_milliseconds_bucket{job="otel-spanmetrics", service_name="olist-shop-worker", span_name="process olist:jobs", le="+Inf"}'
        values: '0+20x80'
      - series: 'traces_span_metrics_duration_milliseconds_bucket{job="otel-spanmetrics", service_name="olist-shop-worker", span_name="DELETE olist", le="250"}'
        values: '0+20x80'
      - series: 'traces_span_metrics_duration_milliseconds_bucket{job="otel-spanmetrics", service_name="olist-shop-worker", span_name="DELETE olist", le="+Inf"}'
        values: '0+20x80'
    promql_expr_test:
      - expr: olist:worker_jobs:rate1m
        eval_time: 5m
        exp_samples:
          - labels: olist:worker_jobs:rate1m
            value: 1
      - expr: olist:worker_errors:ratio_rate1m
        eval_time: 5m
        exp_samples:
          - labels: olist:worker_errors:ratio_rate1m
            value: 0.2
      - expr: olist:worker_duration_seconds:p95_1m
        eval_time: 5m
        exp_samples:
          - labels: olist:worker_duration_seconds:p95_1m
            value: 0.4875

  - name: Worker dừng thì page sau 30 giây, chạy lại thì hết
    interval: 5s
    input_series:
      - series: 'up{job="olist-worker", instance="worker:9101"}'
        values: '1x24 0x24 1x24'
    alert_rule_test:
      - alertname: OlistWorkerDown
        eval_time: 1m
        exp_alerts: []
      - alertname: OlistWorkerDown
        eval_time: 2m20s
        exp_alerts: []
      - alertname: OlistWorkerDown
        eval_time: 3m
        exp_alerts:
          - exp_labels:
              severity: page
              service: worker
            exp_annotations:
              summary: "Prometheus không scrape được worker: job recompute không ai xử lý"
              runbook_url: https://example.invalid/runbooks/olist-worker-down
      - alertname: OlistWorkerDown
        eval_time: 5m
        exp_alerts: []
