{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  labels:
    {{- include "olist-shop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "olist-shop.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "olist-shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      {{- include "olist-shop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gateway.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gateway.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    {{- include "olist-shop.dnsEgress" . | nindent 4 }}
    {{- include "olist-shop.dataEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "olist-shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      {{- include "olist-shop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress
  egress:
    {{- include "olist-shop.dnsEgress" . | nindent 4 }}
    {{- include "olist-shop.dataEgress" . | nindent 4 }}
{{- end }}
