apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olist-shop
spec:
  project: LAB_PROJECT
  destination:
    server: https://kubernetes.default.svc
    namespace: LAB_NAMESPACE
  sources:
    - repoURL: LAB_REPO_URL
      targetRevision: main
      ref: values
    - repoURL: LAB_REPO_URL
      targetRevision: main
      path: chart/olist-shop
      helm:
        releaseName: shop
        valueFiles:
          - $values/gitops/values-lab.yaml
        valuesObject:
          route:
            host: LAB_NAMESPACE.olist.test
    - repoURL: LAB_REPO_URL
      targetRevision: main
      path: gitops/secrets
      plugin:
        name: sops-kustomize
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
