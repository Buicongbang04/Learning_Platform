name: olist-shop-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: localhost:15000
  IMAGE_PREFIX: olist-shop

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_VERSION: 0.10.8
      UV_SHA256_X86_64: f0c566b55683395a62fefb9261a060fa09824914b5682c3b9629fa154762ae2f
      UV_SHA256_AARCH64: 661860e954f87dcd823251191866af3486484d1a9df60eed56f4586ed7559e3d
      PYTHON_VERSION: 3.12.13
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cài uv
        run: |
          if [ "$(uv --version 2>/dev/null | cut -d' ' -f2)" = "$UV_VERSION" ]; then
            echo "Đã có uv $UV_VERSION: $(command -v uv)"
            exit 0
          fi
          case "$(uname -m)" in
            x86_64) target=x86_64-unknown-linux-gnu; sum="$UV_SHA256_X86_64" ;;
            aarch64) target=aarch64-unknown-linux-gnu; sum="$UV_SHA256_AARCH64" ;;
            *) echo "Không có bản uv cho kiến trúc $(uname -m)" >&2; exit 1 ;;
          esac
          node -e 'const [u, o] = process.argv.slice(1); fetch(u).then(r => { if (!r.ok) throw new Error("HTTP " + r.status + " " + u); return r.arrayBuffer(); }).then(b => require("fs").writeFileSync(o, Buffer.from(b))).catch(e => { console.error("Tải lỗi: " + ((e.cause && e.cause.code) || e.message)); process.exit(1); })' \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${target}.tar.gz" "$RUNNER_TEMP/uv.tar.gz"
          echo "${sum}  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 "uv-${target}/uv"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Cài Python và dependency
        run: |
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -q tests'

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      api_image: ${{ steps.push.outputs.api_image }}
      worker_image: ${{ steps.push.outputs.worker_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Tính tag bất biến
        id: meta
        run: |
          tag="sha-${GITHUB_SHA::12}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "devops-ex-output tag=${tag}"
          echo "devops-ex-output revision=${GITHUB_SHA}"
      - name: Build api
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: container/Dockerfile
          target: api
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
      - name: Build worker
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: container/Dockerfile
          target: worker
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/worker:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
      - name: Quét api
        if: ${{ !env.ACT }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:${{ steps.meta.outputs.tag }}
          trivy-config: container/trivy.yaml
          version: v0.76.1
      - name: Quét worker
        if: ${{ !env.ACT }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/worker:${{ steps.meta.outputs.tag }}
          trivy-config: container/trivy.yaml
          version: v0.76.1
      - name: Push và lấy digest
        id: push
        if: ${{ !env.ACT && github.event_name == 'push' }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          for target in api worker; do
            ref="$REGISTRY/$IMAGE_PREFIX/$target:$TAG"
            docker push "$ref"
            pinned="$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref")"
            [[ "$pinned" == *@sha256:* ]] || { echo "Không lấy được digest của $ref" >&2; exit 1; }
            echo "${target}_image=$pinned" >> "$GITHUB_OUTPUT"
          done

  deploy-staging:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      STAGING_URL: http://127.0.0.1:28000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Deploy staging theo digest
        if: ${{ !env.ACT }}
        env:
          OLIST_API_IMAGE: ${{ needs.build.outputs.api_image }}
          OLIST_WORKER_IMAGE: ${{ needs.build.outputs.worker_image }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
        run: docker compose -p olist-shop-staging -f container/compose.yaml up -d --wait --wait-timeout 180
      - name: Smoke test
        if: ${{ !env.ACT }}
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.tag }}
        run: bash ci/smoke-test.sh "$STAGING_URL" "$EXPECTED_VERSION"
