entries:
  - id: api-unreachable
    detect:
      promql: up{job="olist-api"} == 0
    action:
      do: start
      service: api
  - id: api-network-slow
    detect:
      promql: max(scrape_duration_seconds{job="olist-api"}) > 0.5
    action:
      do: restart
      service: api
  - id: db-errors
    detect:
      promql: sum(rate(http_requests_total{job="olist-api", path="/orders/{order_id}", status=~"5.."}[30s])) > 0
    action:
      do: restart
      service: postgres
  - id: db-slow
    detect:
      promql: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="olist-api", path="/orders/{order_id}"}[30s]))) > 0.3
    action:
      do: restart
      service: postgres
  - id: queue-errors
    detect:
      promql: sum(rate(http_requests_total{job="olist-api", path="/jobs/recompute", status=~"5.."}[30s])) > 0
    action:
      do: restart
      service: redis
  - id: queue-slow
    detect:
      promql: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="olist-api", path="/jobs/recompute"}[30s]))) > 0.3
    action:
      do: restart
      service: redis
