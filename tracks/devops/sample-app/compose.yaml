name: olist-shop

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://olist:olist@postgres:5432/olist
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  APP_VERSION: ${APP_VERSION:-dev}

services:
  postgres:
    image: postgres:16
    cpuset: "${DEVOPS_CPUSET:-}"
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      POSTGRES_DB: olist
    ports:
      - "127.0.0.1:${OLIST_SHOP_PG_PORT:-25432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist -d olist"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    cpuset: "${DEVOPS_CPUSET:-}"
    ports:
      - "127.0.0.1:${OLIST_SHOP_REDIS_PORT:-26379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: olist-shop:dev
    restart: unless-stopped
    cpuset: "${DEVOPS_CPUSET:-}"
    environment: *app-env
    ports:
      - "127.0.0.1:${OLIST_SHOP_API_PORT:-28000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    image: olist-shop:dev
    restart: unless-stopped
    cpuset: "${DEVOPS_CPUSET:-}"
    command: ["python", "-m", "olist_shop.worker"]
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9101"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
