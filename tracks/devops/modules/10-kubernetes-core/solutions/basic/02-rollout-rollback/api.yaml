apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  annotations:
    kubernetes.io/change-cause: release 1.0
spec:
  replicas: 4
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: devops-track/olist-shop:1.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: olist-config
          env:
            - name: APP_VERSION
              value: "1.0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: olist-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
