apiVersion: v1
kind: ConfigMap
metadata:
  name: olist-config
  labels:
    app.kubernetes.io/part-of: olist-shop
data:
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: INFO
  APP_VERSION: "1.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: olist-db
  labels:
    app.kubernetes.io/part-of: olist-shop
type: Opaque
stringData:
  POSTGRES_USER: olist
  POSTGRES_PASSWORD: olist-k8s-lab
  POSTGRES_DB: olist
  DATABASE_URL: postgresql+psycopg://olist:olist-k8s-lab@postgres:5432/olist
