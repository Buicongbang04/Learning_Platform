apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: olist
spec:
  parentRefs:
    - name: public
      namespace: devops-gateway
  hostnames:
    - lab.olist.test
  rules:
    - matches:
        - headers:
            - name: X-Canary
              value: always
      backendRefs:
        - name: api-canary
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api-stable
          port: 8000
          weight: 90
        - name: api-canary
          port: 8000
          weight: 10
