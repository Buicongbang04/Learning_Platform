apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: olist-legacy
spec:
  ingressClassName: devops-traefik
  rules:
    - host: legacy.lab.olist.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-stable
                port:
                  name: http
