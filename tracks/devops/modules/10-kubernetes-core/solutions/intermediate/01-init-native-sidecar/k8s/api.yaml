apiVersion: v1
kind: ConfigMap
metadata:
  name: api-proxy
data:
  default.conf: |
    server {
      listen 8080;
      location = /proxy-healthz {
        access_log off;
        return 200 "ok\n";
      }
      location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Served-By olist-proxy always;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      initContainers:
        - name: wait-db
          image: devops-track/olist-shop:1.0
          command:
            - python
            - -c
            - |
              import socket, sys, time
              deadline = time.monotonic() + 120
              while time.monotonic() < deadline:
                  try:
                      socket.create_connection(("postgres", 5432), timeout=2).close()
                      print("postgres:5432 mở")
                      sys.exit(0)
                  except OSError as error:
                      print(f"chờ postgres: {error}", flush=True)
                      time.sleep(2)
              sys.exit(1)
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
        - name: proxy
          image: nginx:1.30.6-alpine
          restartPolicy: Always
          ports:
            - name: proxy
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /proxy-healthz
              port: proxy
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /proxy-healthz
              port: proxy
            periodSeconds: 5
          volumeMounts:
            - name: proxy-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      containers:
        - name: api
          image: devops-track/olist-shop:1.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: olist-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: olist-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: proxy-conf
          configMap:
            name: api-proxy
