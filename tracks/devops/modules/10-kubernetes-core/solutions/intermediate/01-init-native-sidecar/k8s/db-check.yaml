apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-proxy
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    events {}
    stream {
      server {
        listen 5432;
        proxy_pass postgres:5432;
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-check
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-check
    spec:
      restartPolicy: Never
      initContainers:
        - name: pg-proxy
          image: nginx:1.30.6-alpine
          restartPolicy: Always
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 1
            failureThreshold: 30
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      containers:
        - name: check
          image: devops-track/olist-shop:1.0
          command:
            - python
            - -c
            - |
              import psycopg
              with psycopg.connect("host=127.0.0.1 port=5432 user=olist dbname=olist connect_timeout=5") as conn:
                  print("postgres", conn.execute("show server_version").fetchone()[0])
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: olist-db
                  key: POSTGRES_PASSWORD
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: conf
          configMap:
            name: pg-proxy
