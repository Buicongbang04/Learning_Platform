apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backups
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
spec:
  schedule: "15 2 * * *"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: postgres:16.15-alpine
              command:
                - sh
                - -ec
                - |
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  pg_dump -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "/backups/olist-$stamp.dump.part"
                  mv "/backups/olist-$stamp.dump.part" "/backups/olist-$stamp.dump"
                  ls -1 /backups/olist-*.dump | sort -r | tail -n +8 | xargs -r rm -f
                  ls -l /backups
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef: {name: olist-db, key: POSTGRES_USER}
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef: {name: olist-db, key: POSTGRES_DB}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: olist-db, key: POSTGRES_PASSWORD}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: pg-backups
