apiVersion: v1
kind: ConfigMap
metadata:
  name: olist-config
data:
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: INFO
---
apiVersion: v1
kind: Secret
metadata:
  name: olist-db
type: Opaque
stringData:
  POSTGRES_USER: olist
  POSTGRES_PASSWORD: olist-k8s-lab
  POSTGRES_DB: olist
  DATABASE_URL: postgresql+psycopg://olist:olist-k8s-lab@postgres:5432/olist
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.15-alpine
          envFrom:
            - secretRef:
                name: olist-db
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "olist", "-d", "olist", "-h", "127.0.0.1"]
            periodSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.12-alpine
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
