apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  annotations:
    kubernetes.io/change-cause: release 1.0
spec:
  replicas: 4
  # TODO: strategy (maxUnavailable, maxSurge), revisionHistoryLimit, progressDeadlineSeconds
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: devops-track/olist-shop:1.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: olist-config
          env:
            - name: APP_VERSION
              value: "1.0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: olist-db
                  key: DATABASE_URL
          # TODO: readinessProbe, livenessProbe
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
