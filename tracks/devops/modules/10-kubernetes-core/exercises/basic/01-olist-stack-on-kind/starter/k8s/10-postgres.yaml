apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: olist-shop
spec:
  # TODO: StatefulSet cần Service headless
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: olist-shop
spec:
  # TODO: serviceName
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: olist-shop
    spec:
      containers:
        - name: postgres
          image: postgres:16.15-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # TODO: lấy ba biến POSTGRES_* từ Secret olist-db thay vì ghi thẳng ở đây
            - name: POSTGRES_USER
              value: olist
            - name: POSTGRES_PASSWORD
              value: olist-k8s-lab
            - name: POSTGRES_DB
              value: olist
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "olist", "-d", "olist", "-h", "127.0.0.1"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      # TODO: emptyDir mất dữ liệu khi pod bị tạo lại; thay bằng volumeClaimTemplates (StorageClass standard, 1Gi)
      volumes:
        - name: data
          emptyDir: {}
