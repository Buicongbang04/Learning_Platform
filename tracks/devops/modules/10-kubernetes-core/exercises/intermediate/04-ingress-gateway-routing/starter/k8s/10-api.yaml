apiVersion: v1
kind: Service
metadata:
  name: api-stable
spec:
  selector:
    app.kubernetes.io/name: api
    olist.example/track: stable
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      olist.example/track: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        olist.example/track: stable
    spec:
      containers:
        - name: api
          image: devops-track/olist-shop:1.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: olist-config
          env:
            - name: APP_VERSION
              value: "1.4"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: olist-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
