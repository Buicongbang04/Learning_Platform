apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-proxy-classic
data:
  nginx.conf: "worker_processes 1;\npid /tmp/nginx.pid;\nevents {}\nstream {\n  server\
    \ {\n    listen 5432;\n    proxy_pass postgres:5432;\n  }\n}\n"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-check-classic
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-check-classic
    spec:
      restartPolicy: Never
      containers:
      - name: check
        image: devops-track/olist-shop:1.0
        command:
        - python
        - -c
        - "import psycopg\nwith psycopg.connect(\"host=127.0.0.1 port=5432 user=olist\
          \ dbname=olist connect_timeout=5\") as conn:\n    print(\"postgres\", conn.execute(\"\
          show server_version\").fetchone()[0])\n"
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: olist-db
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
      - name: pg-proxy
        image: nginx:1.30.6-alpine
        ports:
        - name: postgres
          containerPort: 5432
        startupProbe:
          tcpSocket:
            port: postgres
          periodSeconds: 1
          failureThreshold: 30
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
      volumes:
      - name: conf
        configMap:
          name: pg-proxy-classic
