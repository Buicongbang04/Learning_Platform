route:
  receiver: triage-chat
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: heartbeat
      matchers: [alertname="Watchdog"]
      repeat_interval: 1m
    - receiver: oncall-pager
      matchers: [severity="page"]
      repeat_interval: 2h
    - receiver: shop-tickets
      matchers: [severity="ticket"]
      group_wait: 5m
      repeat_interval: 24h
    - receiver: search-team
      matchers: [team="search"]

inhibit_rules:
  - source_matchers: [severity="page"]
    target_matchers: [severity="ticket"]
    equal: [service, alertname]
  - source_matchers: [alertname="MaintenanceMode"]
    target_matchers: [severity=~"page|ticket"]

receivers:
  - name: triage-chat
    webhook_configs:
      - url: https://chat.olist-shop.example/hooks/triage
  - name: heartbeat
    webhook_configs:
      - url: https://heartbeat.olist-shop.example/ping/olist-alerting
  - name: oncall-pager
    webhook_configs:
      - url: https://pager.olist-shop.example/v1/olist-shop
        send_resolved: true
  - name: shop-tickets
    webhook_configs:
      - url: https://tickets.olist-shop.example/hooks/alerts
  - name: search-team
    webhook_configs:
      - url: https://chat.olist-shop.example/hooks/search
