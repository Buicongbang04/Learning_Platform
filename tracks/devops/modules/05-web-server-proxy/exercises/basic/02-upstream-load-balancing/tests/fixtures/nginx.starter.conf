worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    log_format upstreamlog '$remote_addr "$request" $status up=$upstream_addr ust=$upstream_status urt=$upstream_response_time';
    access_log /dev/stdout upstreamlog;

    upstream olist_api {
        # TODO 1: thêm olist-api-2:8000 với weight=3 (máy mạnh gấp ba)
        # TODO 2: đặt max_fails=3 fail_timeout=30s cho cả hai server
        server olist-api-1:8000;
    }

    server {
        listen 80;
        server_name shop.olist.test;

        location / {
            proxy_pass http://olist_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
