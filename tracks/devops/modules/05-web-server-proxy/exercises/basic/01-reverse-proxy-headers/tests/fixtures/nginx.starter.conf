worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    # TODO 1: map $http_x_request_id sang biến $req_id: giữ id của client nếu khớp ^[A-Za-z0-9._-]{1,64}$, ngược lại dùng $request_id

    # TODO 2: ghi $req_id (id backend thật sự nhận) vào access log thay cho $request_id
    log_format main '$remote_addr "$request" $status rid=$request_id up=$upstream_addr ust=$upstream_status urt=$upstream_response_time';
    access_log /dev/stdout main;

    # TODO 3: ẩn phiên bản Nginx trong header Server

    upstream olist_api {
        server olist-api-1:8000;
    }

    # TODO 4: server mặc định cổng 80 cho Host lạ: không chuyển tới backend, trả 421 hoặc đóng kết nối (444)

    server {
        listen 80;
        server_name shop.olist.test;

        location / {
            proxy_pass http://olist_api;
            # TODO 5: proxy_set_header cho Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto, X-Request-ID
        }
    }
}
