worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    log_format main '$remote_addr "$request" $status rt=$request_time up=$upstream_addr ust=$upstream_status urt=$upstream_response_time cache=$upstream_cache_status';
    access_log /dev/stdout main;
    server_tokens off;

    # TODO 1: limit_req_zone theo IP client ($binary_remote_addr), zone jobs:10m, rate 1r/s
    # TODO 2: proxy_cache_path /var/cache/nginx/olist, levels=1:2, keys_zone=olist_cache:10m, max_size=100m, inactive=10m, use_temp_path=off

    upstream olist_api {
        server olist-api-1:8000;
    }

    server {
        listen 80;
        server_name shop.olist.test;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # TODO 3: timeout tới upstream: kết nối 2s, chờ response 3s

        location / {
            proxy_pass http://olist_api;
        }

        location /jobs/ {
            proxy_pass http://olist_api;
            # TODO 4: áp zone jobs với burst=5 nodelay; vượt giới hạn trả 429
        }

        location = /stats/revenue-by-state {
            proxy_pass http://olist_api;
            # TODO 5: cache response 200 trong 30s vào olist_cache, trả header X-Cache-Status,
            #         bỏ qua cache (vẫn lưu bản mới) khi request có header X-Cache-Bypass khác rỗng và khác 0
        }
    }
}
