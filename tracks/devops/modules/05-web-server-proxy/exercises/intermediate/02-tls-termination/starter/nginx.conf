worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    log_format main '$remote_addr $scheme "$request" $status $ssl_protocol up=$upstream_addr ust=$upstream_status';
    access_log /dev/stdout main;
    server_tokens off;

    upstream olist_api {
        server olist-api-1:8000;
    }

    # TODO 1: cổng 80 cho shop.olist.test chỉ còn hai việc:
    #   - /.well-known/acme-challenge/ phục vụ tệp tĩnh từ /var/www/acme, không chuyển hướng
    #   - mọi đường dẫn khác chuyển sang https://shop.olist.test, giữ nguyên path và query (301 hoặc 308)
    server {
        listen 80;
        server_name shop.olist.test;

        location / {
            proxy_pass http://olist_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # TODO 2: server cổng 443 (ssl, http2) cho shop.olist.test, proxy tới olist_api như trên
    #   - cert /etc/nginx/tls/fullchain.pem, key /etc/nginx/tls/privkey.pem, chỉ TLSv1.2 và TLSv1.3
    #   - HSTS max-age một năm trên mọi response, kể cả 404 và 5xx

    # TODO 3: server mặc định cổng 443 từ chối bắt tay TLS khi SNI lạ hoặc không có SNI
}
