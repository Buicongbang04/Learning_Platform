worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    map $http_x_request_id $req_id {
        default $request_id;
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
    }

    log_format main '$remote_addr "$request" $status rid=$req_id up=$upstream_addr ust=$upstream_status urt=$upstream_response_time';
    access_log /dev/stdout main;

    server_tokens off;

    upstream olist_api {
        server olist-api-1:8000;
    }

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name shop.olist.test;

        location / {
            proxy_pass http://olist_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
        }
    }
}
