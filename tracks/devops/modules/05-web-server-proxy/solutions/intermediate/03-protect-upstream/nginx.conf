worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    log_format main '$remote_addr "$request" $status rt=$request_time up=$upstream_addr ust=$upstream_status urt=$upstream_response_time cache=$upstream_cache_status';
    access_log /dev/stdout main;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=jobs:10m rate=1r/s;
    proxy_cache_path /var/cache/nginx/olist levels=1:2 keys_zone=olist_cache:10m max_size=100m inactive=10m use_temp_path=off;

    upstream olist_api {
        server olist-api-1:8000;
    }

    server {
        listen 80;
        server_name shop.olist.test;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;

        location / {
            proxy_pass http://olist_api;
        }

        location /jobs/ {
            proxy_pass http://olist_api;
            limit_req zone=jobs burst=5 nodelay;
            limit_req_status 429;
        }

        location = /stats/revenue-by-state {
            proxy_pass http://olist_api;
            proxy_cache olist_cache;
            proxy_cache_valid 200 30s;
            proxy_cache_bypass $http_x_cache_bypass;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
