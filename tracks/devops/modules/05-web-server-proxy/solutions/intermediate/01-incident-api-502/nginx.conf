worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr "$request" $status up=$upstream_addr ust=$upstream_status urt=$upstream_response_time rid=$request_id';
    access_log /dev/stdout main;
    server_tokens off;

    upstream olist_api {
        server olist-api-1:8000 max_fails=3 fail_timeout=30s;
        server olist-api-2:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name shop.olist.test;
        root /usr/share/nginx/html;

        location = /healthz {
            access_log off;
            proxy_pass http://olist_api/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://olist_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
