name: olist-shop-ci

# TODO 1: chỉ chạy khi push lên main và khi có pull request (mọi nhánh đích).
on: push

# TODO 2: quyền mặc định của GITHUB_TOKEN cho cả workflow: chỉ đọc nội dung repo.
# TODO 3: concurrency theo github.ref, huỷ lần chạy cũ khi có commit mới.

jobs:
  test:
    runs-on: ubuntu-latest
    # TODO 4: timeout-minutes cho job.
    env:
      UV_VERSION: 0.10.8
      UV_SHA256_X86_64: f0c566b55683395a62fefb9261a060fa09824914b5682c3b9629fa154762ae2f
      UV_SHA256_AARCH64: 661860e954f87dcd823251191866af3486484d1a9df60eed56f4586ed7559e3d
      PYTHON_VERSION: 3.12.13
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cài uv
        run: |
          if [ "$(uv --version 2>/dev/null | cut -d' ' -f2)" = "$UV_VERSION" ]; then
            echo "Đã có uv $UV_VERSION: $(command -v uv)"
            exit 0
          fi
          case "$(uname -m)" in
            x86_64) target=x86_64-unknown-linux-gnu; sum="$UV_SHA256_X86_64" ;;
            aarch64) target=aarch64-unknown-linux-gnu; sum="$UV_SHA256_AARCH64" ;;
            *) echo "Không có bản uv cho kiến trúc $(uname -m)" >&2; exit 1 ;;
          esac
          node -e 'const [u, o] = process.argv.slice(1); fetch(u).then(r => { if (!r.ok) throw new Error("HTTP " + r.status + " " + u); return r.arrayBuffer(); }).then(b => require("fs").writeFileSync(o, Buffer.from(b))).catch(e => { console.error("Tải lỗi: " + ((e.cause && e.cause.code) || e.message)); process.exit(1); })' \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${target}.tar.gz" "$RUNNER_TEMP/uv.tar.gz"
          echo "${sum}  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 "uv-${target}/uv"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Cài Python và dependency
        run: |
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" -r requirements.txt -r requirements-dev.txt
      # TODO 5: bước chạy test của Olist Shop bằng "$RUNNER_TEMP/venv/bin/python" -m pytest.

  # TODO 6: job image chạy sau test, quyền contents: read và packages: write, timeout-minutes.
  #   - outputs.tag lấy từ bước tính tag.
  #   - Checkout, rồi bước run: tính tag sha-<12 ký tự đầu của GITHUB_SHA>, ghi vào $GITHUB_OUTPUT,
  #     in "devops-ex-output tag=<tag>" và "devops-ex-output revision=<GITHUB_SHA>".
  #   - docker/login-action vào ghcr.io bằng secrets.GITHUB_TOKEN, chỉ chạy trên GitHub.
  #   - docker/build-push-action: context ., tag theo bước tính tag, build-args APP_VERSION,
  #     chỉ push khi sự kiện là push, chỉ chạy trên GitHub.
