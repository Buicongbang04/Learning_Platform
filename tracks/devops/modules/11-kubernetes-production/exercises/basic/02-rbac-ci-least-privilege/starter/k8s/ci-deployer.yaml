apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  labels:
    app.kubernetes.io/part-of: olist-shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  labels:
    app.kubernetes.io/part-of: olist-shop
rules:
  # TODO: bản "cho chạy được trước đã" của sprint trước; thu hẹp đúng bảng quyền trong README
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "configmaps", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  labels:
    app.kubernetes.io/part-of: olist-shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
