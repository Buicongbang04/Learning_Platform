apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-operator
  labels:
    app.kubernetes.io/name: storefront-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront-operator
    spec:
      serviceAccountName: storefront-operator
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: devops-track/olist-shop:1.0
          command: ["python", "-u", "/app/controller.py"]
          env:
            - name: STOREFRONT_GROUP
              value: lab.olist.test
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: storefront-operator
