apiVersion: v1
kind: ServiceAccount
metadata:
  name: storefront-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storefront-operator
rules:
  - apiGroups: ["lab.olist.test"]
    resources: ["storefronts"]
    verbs: ["get", "list", "watch"]
  # TODO: đúng những quyền operator cần để ghi status, Deployment, ConfigMap; không hơn
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: storefront-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: storefront-operator
subjects:
  - kind: ServiceAccount
    name: storefront-operator
