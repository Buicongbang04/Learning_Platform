apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: revenue-report
spec:
  schedule: "0 19 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: devops-track/olist-shop:1.0
              command: ["python", "-c", "print('report')"]
