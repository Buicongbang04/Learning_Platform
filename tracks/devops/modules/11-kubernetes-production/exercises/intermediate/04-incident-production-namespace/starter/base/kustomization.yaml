apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: olist-shop
resources:
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - pod-reporter.yaml
secretGenerator:
  - name: olist-db
    literals:
      - POSTGRES_USER=olist
      - POSTGRES_PASSWORD=olist-k8s-lab
      - POSTGRES_DB=olist
      - DATABASE_URL=postgresql+psycopg://olist:olist-k8s-lab@postgres:5432/olist
