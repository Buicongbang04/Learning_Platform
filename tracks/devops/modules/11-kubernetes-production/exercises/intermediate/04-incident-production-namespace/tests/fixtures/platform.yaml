apiVersion: v1
kind: ResourceQuota
metadata:
  name: production
  labels:
    olist.io/owner: platform
spec:
  hard:
    pods: "12"
    requests.cpu: "1"
    requests.memory: 1280Mi
    limits.memory: 3Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: production
  labels:
    olist.io/owner: platform
spec:
  limits:
    - type: Container
      max:
        cpu: "1"
        memory: 512Mi
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
