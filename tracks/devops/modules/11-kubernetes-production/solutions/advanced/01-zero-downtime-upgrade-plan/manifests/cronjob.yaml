apiVersion: batch/v1
kind: CronJob
metadata:
  name: revenue-report
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: devops-track/olist-shop:1.0
              command: ["python", "-c", "print('report')"]
