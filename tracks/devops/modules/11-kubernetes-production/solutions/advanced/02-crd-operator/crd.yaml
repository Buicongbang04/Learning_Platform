apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: storefronts.lab.olist.test
spec:
  group: lab.olist.test
  scope: Namespaced
  names:
    plural: storefronts
    singular: storefront
    kind: Storefront
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - replicas
                - message
              x-kubernetes-validations:
                - rule: "!self.maintenance || self.replicas == 1"
                  message: "maintenance chỉ chạy 1 replica"
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 5
                message:
                  type: string
                  minLength: 1
                  maxLength: 80
                maintenance:
                  type: boolean
                  default: false
            status:
              type: object
              properties:
                readyReplicas:
                  type: integer
                phase:
                  type: string
                observedGeneration:
                  type: integer
