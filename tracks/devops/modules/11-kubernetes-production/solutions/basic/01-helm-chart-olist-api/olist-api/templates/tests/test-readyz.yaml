apiVersion: v1
kind: Pod
metadata:
  name: {{ include "olist-api.fullname" . }}-test-readyz
  labels:
    {{- include "olist-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: readyz
      image: {{ include "olist-api.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          with urllib.request.urlopen("http://{{ include "olist-api.fullname" . }}:{{ .Values.service.port }}/readyz", timeout=5) as r:
              body = json.load(r)
          print(r.status, body)
          assert r.status == 200 and body == {"db": "ok", "redis": "ok"}, body
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
