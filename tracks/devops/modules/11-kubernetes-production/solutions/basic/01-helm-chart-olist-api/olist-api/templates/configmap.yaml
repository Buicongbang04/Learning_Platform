apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "olist-api.fullname" . }}
  labels:
    {{- include "olist-api.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  APP_VERSION: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
