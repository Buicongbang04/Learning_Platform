- name: Chuẩn bị máy cho Olist Shop
  hosts: olist
  become: true
  gather_facts: false
  tasks:
    - name: Tạo group olist
      ansible.builtin.group:
        name: olist
        system: true

    - name: Tạo user dịch vụ olist
      ansible.builtin.user:
        name: olist
        group: olist
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/olist-shop
        create_home: false

    - name: Tạo thư mục cấu hình
      ansible.builtin.file:
        path: /etc/olist-shop
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ghi host.ini
      ansible.builtin.template:
        src: templates/host.ini.j2
        dest: /etc/olist-shop/host.ini
        owner: root
        group: root
        mode: "0644"
