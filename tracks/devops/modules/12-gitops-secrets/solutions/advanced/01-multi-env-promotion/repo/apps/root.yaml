apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olist-root
  namespace: argocd
spec:
  project: olist-platform
  source:
    repoURL: https://git.example.com/olist/gitops.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
