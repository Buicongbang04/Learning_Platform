apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: olist-shop
resources:
  - redis.yaml
  - api.yaml
configMapGenerator:
  - name: olist-config
    literals:
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////tmp/olist_shop.db
