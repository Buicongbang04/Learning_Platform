apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olist-shop
spec:
  project: LAB_PROJECT
  source:
    repoURL: LAB_REPO_URL
    targetRevision: main
    path: shop
    plugin:
      name: sops-kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: LAB_NAMESPACE
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
