apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: olist-shop
resources:
  - postgres.yaml
  - redis.yaml
  - migrate.yaml
  - api.yaml
configMapGenerator:
  - name: olist-config
    literals:
      - APP_VERSION=1.0
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://olist@postgres:5432/olist
