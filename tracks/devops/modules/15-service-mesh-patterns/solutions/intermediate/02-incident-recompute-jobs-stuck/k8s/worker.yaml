apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  labels: {app.kubernetes.io/name: worker, app.kubernetes.io/part-of: olist-shop}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: {app.kubernetes.io/name: worker, app.kubernetes.io/part-of: olist-shop}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: worker, app.kubernetes.io/part-of: olist-shop, app.kubernetes.io/version: "1.0"}
      annotations:
        kubectl.kubernetes.io/default-container: worker
        config.linkerd.io/proxy-cpu-request: 10m
        config.linkerd.io/proxy-memory-limit: 128Mi
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      containers:
        - name: worker
          image: devops-track/olist-shop:1.0
          command: ["python", "-m", "olist_shop.worker"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: olist-db, key: DATABASE_URL}}
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - {name: LOG_LEVEL, value: INFO}
          ports: [{name: metrics, containerPort: 9101}]
          resources: {requests: {cpu: 20m, memory: 96Mi}, limits: {memory: 192Mi}}
