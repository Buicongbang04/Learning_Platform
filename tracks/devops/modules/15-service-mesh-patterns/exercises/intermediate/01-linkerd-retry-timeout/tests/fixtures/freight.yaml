apiVersion: v1
kind: ServiceAccount
metadata: {name: freight}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: checkout}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: freight, labels: {app.kubernetes.io/name: freight}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: freight}}
  template:
    metadata: {labels: {app.kubernetes.io/name: freight}}
    spec:
      serviceAccountName: freight
      containers:
        - name: freight
          image: devops-track/olist-shop:1.0
          command: ["python", "/code/freight_quote.py"]
          env:
            - {name: SEED, value: "15"}
            - {name: FAIL_RATE, value: "0.2"}
            - {name: SLOW_RATE, value: "0.1"}
            - {name: SLOW_SECONDS, value: "2.5"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3}
          volumeMounts: [{name: code, mountPath: /code, readOnly: true}]
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 64Mi}}
      volumes: [{name: code, configMap: {name: freight-code}}]
---
apiVersion: v1
kind: Service
metadata: {name: freight}
spec:
  selector: {app.kubernetes.io/name: freight}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, labels: {app.kubernetes.io/name: checkout}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: checkout}}
  template:
    metadata: {labels: {app.kubernetes.io/name: checkout}}
    spec:
      serviceAccountName: checkout
      terminationGracePeriodSeconds: 1
      containers:
        - name: checkout
          image: devops-track/olist-shop:1.0
          command: ["python", "-c", "import time; time.sleep(10**9)"]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
