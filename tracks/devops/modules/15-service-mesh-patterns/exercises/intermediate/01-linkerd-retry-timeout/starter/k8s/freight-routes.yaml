apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: freight-quote
  annotations:
    retry.linkerd.io/http: 5xx
    # TODO: số lần thử lại tối đa, timeout mỗi lần thử, timeout cả request
spec:
  parentRefs:
    - group: core
      kind: Service
      name: freight
      port: 8080
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: freight
          port: 8080
# TODO: route riêng cho POST /reserve
