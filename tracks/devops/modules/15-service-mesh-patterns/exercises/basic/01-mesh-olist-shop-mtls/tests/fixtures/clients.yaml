apiVersion: v1
kind: ServiceAccount
metadata: {name: storefront}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: storefront, labels: {app.kubernetes.io/name: storefront}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: storefront}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: storefront}
      annotations: {linkerd.io/inject: enabled}
    spec:
      serviceAccountName: storefront
      terminationGracePeriodSeconds: 1
      containers:
        - name: shell
          image: devops-track/olist-shop:1.0
          command: ["python", "-c", "import time; time.sleep(10**9)"]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
---
