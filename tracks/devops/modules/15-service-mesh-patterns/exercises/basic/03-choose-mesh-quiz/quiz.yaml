questions:
  - id: three-services
    kind: knowledge
    type: single
    prompt: "Olist Shop có ba service (api, worker, Postgres/Redis) trên một cluster, một team 4 người, chưa có yêu cầu mTLS từ kiểm toán. Retry đã có trong code client. Nên làm gì về service mesh?"
    options:
      - { id: a, text: "Cài Istio sidecar ngay để có sẵn mọi tính năng trước khi hệ thống lớn lên" }
      - { id: b, text: "Chưa dùng mesh: NetworkPolicy, retry trong client và metrics của app là đủ ở quy mô này" }
      - { id: c, text: "Cài Consul Connect vì nó chạy được cả ngoài Kubernetes nếu sau này cần" }
      - { id: d, text: "Tự viết sidecar Envoy với cấu hình tĩnh cho từng pod, để không phụ thuộc vào control plane nào cả" }
  - id: pci-mtls
    kind: knowledge
    type: single
    prompt: "Kiểm toán PCI DSS yêu cầu mọi traffic giữa các service xử lý thẻ phải mã hoá và xác thực hai chiều. Có 25 service Kubernetes, 2 người platform, muốn ít thứ để vận hành nhất. Chọn gì?"
    options:
      - { id: a, text: "Tự cấp chứng chỉ cho từng service bằng cert-manager rồi sửa code từng service để bật TLS hai chiều" }
      - { id: b, text: "Đặt một Nginx ingress có TLS phía trước, traffic bên trong cluster để HTTP thường" }
      - { id: c, text: "Linkerd: mTLS bật mặc định cho mọi pod trong mesh, xoay chứng chỉ tự động, ít cấu hình" }
      - { id: d, text: "NetworkPolicy chặn mọi luồng không cần thiết, vì chặn đường đi cũng tương đương mã hoá" }
  - id: vm-and-k8s
    kind: knowledge
    type: single
    prompt: "Một nửa hệ thống chạy trên VM (Nomad, systemd), một nửa trên Kubernetes, cần service discovery và mTLS chung cho cả hai, đã dùng Vault. Công cụ nào hợp nhất?"
    options:
      - { id: a, text: "Linkerd, vì nó nhẹ nhất trong các mesh trên Kubernetes" }
      - { id: b, text: "Consul service mesh: chạy cả trên VM lẫn Kubernetes, tích hợp Vault làm CA" }
      - { id: c, text: "Cilium với eBPF trên các node Kubernetes, còn phía VM thì mỗi team tự lo TLS và discovery" }
      - { id: d, text: "Kubernetes Service và CoreDNS, cấu hình thêm cho VM gọi vào cluster" }
  - id: rich-traffic
    kind: knowledge
    type: single
    prompt: "Team cần định tuyến theo header cho từng nhóm khách, fault injection để thử nghiệm, rate limit toàn cục, mở rộng bằng WebAssembly, và có người chuyên vận hành mesh. Chọn gì?"
    options:
      - { id: a, text: "Istio: tính năng traffic phong phú nhất, đổi lại cấu hình và vận hành phức tạp hơn" }
      - { id: b, text: "Linkerd, vì proxy viết bằng Rust nhẹ và nhanh nên hợp với mọi trường hợp cần traffic phức tạp" }
      - { id: c, text: "Không dùng mesh, viết các tính năng đó trong thư viện client của từng ngôn ngữ" }
      - { id: d, text: "kube-proxy chế độ IPVS với thuật toán cân bằng tải khác cho từng Service" }
  - id: sidecar-cost
    kind: knowledge
    type: single
    prompt: "Cluster 800 pod, mỗi pod một sidecar Envoy khoảng 50 MiB; team lo về RAM và việc phải restart pod mỗi lần nâng proxy. Hướng nào giải quyết đúng hai lo ngại này?"
    options:
      - { id: a, text: "Tắt mTLS để mỗi sidecar dùng ít RAM hơn, vẫn giữ nguyên sidecar trong mọi pod của cluster" }
      - { id: b, text: "Tăng replica của control plane, vì RAM của sidecar phụ thuộc số replica đó" }
      - { id: c, text: "Bỏ hẳn mesh, chuyển retry và mTLS vào code của mọi service trong 800 pod, làm xong trong một quý" }
      - { id: d, text: "Ambient: proxy L4 theo node lo mTLS, proxy L7 chỉ cho service cần, nâng proxy không restart pod" }
  - id: retry-where
    kind: knowledge
    type: single
    prompt: "Request của app di động đi qua mobile-bff → catalog → search. mobile-bff gọi catalog và catalog gọi search, mỗi chặng retry 2 lần (tổng 3 lần thử) khi gặp 503. search quá tải, trả 503 cho mọi request. Mỗi request của người dùng thành tối đa bao nhiêu request tới search?"
    options:
      - { id: a, text: "3 request, vì chỉ chặng gọi thẳng search mới retry" }
      - { id: b, text: "6 request, cộng số lần thử của hai chặng" }
      - { id: c, text: "9 request: 3 lần thử của mobile-bff nhân 3 lần của catalog" }
      - { id: d, text: "27 request, nhân thêm một lần nữa cho app di động" }
  - id: payment-retry
    kind: knowledge
    type: single
    prompt: "Gọi POST /payments bị timeout, không biết server đã trừ tiền chưa. Cách retry nào an toàn?"
    options:
      - { id: a, text: "Không bao giờ retry POST, báo lỗi cho khách và để khách bấm lại nút thanh toán" }
      - { id: b, text: "Retry với cùng Idempotency-Key, server lưu kết quả theo key và trả lại kết quả cũ" }
      - { id: c, text: "Retry ngay lập tức, liên tục cho tới khi nhận được 200, để khách hàng không phải chờ lâu thêm nữa" }
      - { id: d, text: "Đổi sang GET /payments?order_id=... vì GET được retry an toàn theo chuẩn HTTP" }
  - id: slow-dependency
    kind: knowledge
    type: single
    prompt: "Dịch vụ báo giá vận chuyển của đối tác thỉnh thoảng treo 30 giây; mọi thread của api bị giữ chờ nó, nên cả trang đơn hàng (không cần báo giá) cũng chết. Pattern nào cắt lan truyền này trực tiếp nhất?"
    options:
      - { id: a, text: "Bulkhead: pool kết nối riêng có giới hạn cho đối tác, cộng timeout và circuit breaker" }
      - { id: b, text: "Cache-Aside cho mọi báo giá, vì cache luôn làm mọi dependency chậm trở nên nhanh hơn và ổn định hơn" }
      - { id: c, text: "Event Sourcing cho đơn hàng để lưu mọi lần gọi đối tác thành event" }
      - { id: d, text: "Strangler Fig để thay dần dịch vụ của đối tác bằng dịch vụ tự viết" }
  - id: black-friday-spike
    kind: knowledge
    type: single
    prompt: "Black Friday, lượng đơn vào gấp 20 lần trong 15 phút; bước tính hoá đơn và gửi email không cần xong ngay. Pattern nào giữ cho backend không sập?"
    options:
      - { id: a, text: "CQRS để tách mô hình đọc và mô hình ghi của đơn hàng thành hai database riêng biệt, mỗi bên tự scale" }
      - { id: b, text: "Health Endpoint Monitoring để biết khi nào backend quá tải" }
      - { id: c, text: "Queue-Based Load Leveling: đẩy việc vào hàng đợi, worker xử lý theo tốc độ của mình" }
      - { id: d, text: "Sidecar để mỗi pod có một proxy phụ ghi log lượng đơn vào" }
  - id: legacy-migration
    kind: knowledge
    type: single
    prompt: "Olist Shop có một monolith PHP cũ; team muốn tách dần từng tính năng (tìm kiếm, giỏ hàng) ra service mới mà không có ngày big-bang. Pattern nào?"
    options:
      - { id: a, text: "Ambassador để mọi service mới có proxy riêng ra ngoài" }
      - { id: b, text: "Strangler Fig: đặt lớp định tuyến phía trước, chuyển từng route sang service mới" }
      - { id: c, text: "Sharding monolith thành nhiều bản theo bang của khách hàng" }
      - { id: d, text: "Materialized View cho mọi bảng của monolith, rồi tắt monolith vào cuối tuần khi các view đã đầy đủ" }
  - id: mesh-gives
    kind: knowledge
    type: multi
    prompt: "Một service mesh như Linkerd cho bạn những gì mà không phải sửa code ứng dụng? Chọn mọi đáp án đúng."
    options:
      - { id: a, text: "mTLS giữa các pod trong mesh, danh tính theo ServiceAccount" }
      - { id: b, text: "Số request, tỉ lệ thành công, độ trễ theo từng cặp service" }
      - { id: c, text: "Retry, timeout cấu hình theo route" }
      - { id: d, text: "Idempotency cho POST: tự chống trừ tiền hai lần khi retry" }
      - { id: e, text: "Chia traffic theo tỉ lệ giữa hai phiên bản để làm canary" }
  - id: mesh-not-fix
    kind: knowledge
    type: multi
    prompt: "Những dấu hiệu nào cho thấy tổ chức CHƯA nên đưa service mesh vào lúc này? Chọn mọi đáp án đúng."
    options:
      - { id: a, text: "Chưa ai trong team đọc được metrics và log của proxy khi có sự cố" }
      - { id: b, text: "Chỉ có hai service, gọi nhau qua một hàng đợi" }
      - { id: c, text: "Cluster đang thiếu RAM và không có ngân sách thêm node" }
      - { id: d, text: "Kiểm toán bắt buộc mTLS giữa mọi service trong quý tới" }
