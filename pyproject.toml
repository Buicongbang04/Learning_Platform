[project]
name = "data-learning"
version = "0.1.0"
description = "Lộ trình tự học Data Engineer (và các track khác) kèm bài tập thực hành"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pytest>=8.3",
    "pyyaml>=6.0",
    "requests>=2.32",
    "faker>=30.0",
    "pandas>=2.2",
    "polars>=1.9",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pymongo>=4.10",
    "mongomock>=4.2",
    "redis>=5.1",
    "fakeredis>=2.25",
    "cassandra-driver>=3.29",
    "neo4j>=5.25",
    "boto3>=1.35",
    "deltalake>=0.21",
    "pyspark>=3.5,<4",
    "kafka-python-ng>=2.2",
    "pandera>=0.21",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "prefect>=3.0",
    "streamlit>=1.39",
    "cryptography>=43.0",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "prometheus-client>=0.21",
    "moto[s3]>=5.0",
    "numpy>=2.5.4",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:cacheprovider --import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning"]
