[project]
name = "data-learning"
version = "0.1.0"
description = "Lộ trình tự học Data Engineer (và các track khác) kèm bài tập thực hành"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pytest>=8.3",
    "pyyaml>=6.0",
    "requests>=2.32",
    "faker>=30.0",
    "pandas>=2.2",
    "polars>=1.9",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pymongo>=4.10",
    "mongomock>=4.2",
    "redis>=5.1",
    "fakeredis>=2.25",
    "cassandra-driver>=3.29",
    "neo4j>=5.25",
    "boto3>=1.35",
    "deltalake>=0.21",
    "pyspark>=3.5,<4",
    "kafka-python-ng>=2.2",
    "pandera>=0.21",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "prefect>=3.0",
    "streamlit>=1.39",
    "cryptography>=43.0",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "prometheus-client>=0.21",
    "moto[s3]>=5.0",
    "numpy>=2.5.4",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "kagglehub>=0.3",
    "scikit-learn>=1.9.1",
    "lightgbm>=4.7.0",
    "shap==0.53.0",
    "linearmodels==7.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "mlflow==3.17.1",
    "fastapi==0.143.1",
    "uvicorn>=0.54.0",
    "onnx>=1.23.2",
    "onnxruntime==1.31.0",
    "skl2onnx>=1.20.0",
    "huggingface-hub>=1.32.0,<2.0",
    "sentence-transformers==6.2.0",
    "transformers==5.22.0",
    # AI Engineer giai đoạn 3 (chạy CPU; thư viện chỉ GPU nằm ở setup/gpu). Ghim phiên bản phát hành >= 2 tuần trước 2026-10-30.
    "gymnasium[classic-control,box2d]==1.4.0",
    "ale-py==0.12.1",
    "opencv-python-headless==5.0.0.93",
    "ultralytics==8.4.178",
    "peft==0.21.2",
    "trl==1.16.0",
    "datasets==5.1.0",
    "accelerate==1.15.0",
    "diffusers==0.41.0",
    "tiktoken==0.14.0",
    "tokenizers==0.23.3",
    "langchain-core==1.6.12",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    "faiss-cpu==1.15.1",
    "chromadb==1.5.9",
    "qdrant-client==1.19.1",
    "lancedb==0.40.0",
    "pgvector==0.5.1",
    "mcp==2.3.0",
    "faster-whisper==1.2.1",
    "soundfile==0.14.0",
    "jiwer==4.0.0",
    "sacrebleu==2.6.0",
    "pennylane==0.45.1",
    "opentelemetry-sdk==1.45.1",
    "gguf==0.19.0",
    "imageio[ffmpeg]==2.38.1",
]

[dependency-groups]
# Build từ source (cần gcc, g++, cmake, ~4 phút), không có wheel CPU dựng sẵn: cài bằng `uv sync --group llama`
llama = ["llama-cpp-python==0.3.36"]

[tool.uv]
package = false
# Phụ thuộc gián tiếp phát hành < 2 tuần trước 2026-10-30: chặn ở bản cũ hơn (bỏ dòng này khi đã đủ 2 tuần)
constraint-dependencies = [
    "av<=19.0.1",
    "ctranslate2<=4.8.3",
    "googleapis-common-protos<=1.75.5",
    "grpcio<=1.84.0",
    "imageio-ffmpeg<=0.6.0",
    "langchain-protocol<=0.0.19",
    "langgraph-checkpoint<=4.3.0",
    "langgraph-sdk<=0.4.8",
    "langsmith<=0.14.11",
    "scipy-openblas32<=0.3.34.237.1",
    "sse-starlette<=3.5.0",
    "ultralytics-platform<=0.1.89",
    "ultralytics-thop<=2.2.2",
    "uuid-utils<0.18",
    "xxhash<=4.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:cacheprovider --import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
